<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141D1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stammbaum">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Stammbaum</title>
<style>[hidden]{display:none!important}
:root{--bg:#141D1A;--sf:#1B2723;--sf2:#24332E;--ln:#33453E;--tx:#ECE6D6;--mu:#9DAAA2;--ac:#C9A44D;--aci:#1d1606;--m:#8DB0C4;--w:#D49A92;--q:#8E9893;--bad:#D9776B;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Noto Serif",serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
--hdr:56px;--nav:64px;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--rail:0px;color-scheme:dark}
[data-theme=light]{--bg:#E8EDE9;--sf:#FFFFFF;--sf2:#F1F5F2;--ln:#CBD5CE;--tx:#1B2622;--mu:#56655E;--ac:#8A6716;--aci:#fff;--m:#3F6E8C;--w:#A4544A;--q:#7A827E;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 var(--sans);-webkit-tap-highlight-color:transparent}
body{padding:calc(var(--hdr) + var(--st)) 0 calc(var(--nav) + var(--sb)) var(--rail)}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.s{width:16px;height:16px}
header{position:fixed;top:0;left:var(--rail);right:0;z-index:20;height:calc(var(--hdr) + var(--st));padding:var(--st) 6px 0;display:flex;align-items:center;gap:2px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--ln)}
header h1{flex:1;margin:0 8px;font:600 1.15rem/1.2 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hact{display:flex;gap:2px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;height:calc(var(--nav) + var(--sb));padding-bottom:var(--sb);display:flex;background:var(--sf);border-top:1px solid var(--ln)}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mu);text-decoration:none;font-size:.72rem}
nav a.on{color:var(--ac)}
@media(min-width:900px){:root{--rail:88px}body{padding-bottom:0}nav{top:0;right:auto;width:88px;height:auto;flex-direction:column;justify-content:flex-start;padding:calc(var(--st) + 72px) 0 0;border-top:0;border-right:1px solid var(--ln)}nav a{flex:0 0 78px}}
main{max-width:780px;margin:0 auto;padding:16px 16px 32px}
.ib{appearance:none;border:0;background:transparent;width:44px;height:44px;border-radius:12px;display:inline-grid;place-items:center;cursor:pointer;font-size:1.25rem;flex:none}
.ib:active{background:var(--sf2)}
.btn{appearance:none;border:1px solid var(--ln);background:var(--sf2);border-radius:12px;min-height:46px;padding:10px 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-align:left}
.btn.pri{background:var(--ac);color:var(--aci);border-color:var(--ac);font-weight:600}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.9rem}
.btn.wide{width:100%;justify-content:flex-start}
.muted{color:var(--mu)}
small{color:var(--mu)}
h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2}
h3.sec{font-size:1.1rem;margin:28px 0 10px}
/* Avatare */
.av{width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;flex:none;overflow:hidden;font:600 calc(var(--s)*.36)/1 var(--serif);background:var(--sf2);border:2px solid var(--q)}
.av.m{border-color:var(--m)}.av.w{border-color:var(--w)}
.av img{width:100%;height:100%;object-fit:cover}
/* Start */
.hero{display:flex;gap:18px;align-items:center;padding:8px 0 20px;border-bottom:1px solid var(--ac);margin-bottom:18px}
.wappen{appearance:none;background:none;border:0;padding:0;width:104px;height:120px;flex:none;cursor:pointer;display:grid;place-items:center}
.wappen img{max-width:100%;max-height:100%;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.wappen.empty{border:1.5px dashed var(--ln);border-radius:14px 14px 50% 50%;color:var(--mu);gap:4px;align-content:center}
.fam{font-size:clamp(2rem,8vw,2.9rem);margin:0;letter-spacing:.01em;line-height:1.05}
.sub{margin:6px 0 0;color:var(--mu);font-family:var(--serif);font-style:italic}
.note{background:var(--sf2);border-left:3px solid var(--ac);padding:10px 14px;border-radius:0 10px 10px 0;margin-bottom:16px;font-size:.95rem}
.note button{appearance:none;border:0;background:none;color:var(--ac);text-decoration:underline;padding:0;cursor:pointer}
.treecard{appearance:none;width:100%;display:flex;align-items:center;gap:16px;background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:14px 16px;cursor:pointer;text-align:left}
.treecard svg{width:150px;flex:none}
.treecard h3{margin:0 0 4px;font-size:1.4rem}.treecard p{margin:0;color:var(--mu)}
.strip{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory;margin:0 -16px;padding-left:16px;padding-right:16px}
.pchip{appearance:none;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;scroll-snap-align:start;width:76px;flex:none;padding:0}
.pchip span{font-weight:600;font-size:.9rem;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip small{font-size:.72rem;text-align:center;line-height:1.2;margin-top:-4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{appearance:none;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;min-height:84px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:8px;font-family:var(--serif);font-size:1.05rem}
.tile .i{color:var(--ac)}
.story{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;cursor:pointer;margin-bottom:12px;display:block}
.story h3{margin:4px 0 6px;font-size:1.25rem}
.story p{margin:0;color:var(--mu);font-family:var(--serif);line-height:1.55}
.kind{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--mu)}
.kind .i{color:var(--ac)}
.sfoot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;min-height:30px}
.faces{display:flex}.faces .av{margin-right:-8px;border-width:2px}
.fact{display:flex;gap:12px;align-items:flex-start;background:var(--sf2);border-radius:14px;padding:14px 8px 14px 16px;font-family:var(--serif);font-size:1.05rem}
.fact p{margin:0;flex:1}
/* Liste */
.search{position:relative;margin-bottom:10px}
.search input{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--ln);background:var(--sf);padding:10px 14px 10px 42px}
.search .i{position:absolute;left:13px;top:13px;color:var(--mu)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chip{appearance:none;border:1px solid var(--ln);background:transparent;border-radius:99px;padding:7px 14px;white-space:nowrap;cursor:pointer;font-size:.92rem;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--aci)}
.plist{list-style:none;margin:0;padding:0}
.prow{appearance:none;width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;border-bottom:1px solid var(--ln);padding:10px 2px;text-align:left;cursor:pointer;min-height:64px}
.pm{flex:1;min-width:0}.pm b{display:block;font-family:var(--serif);font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt{display:flex;align-items:center;gap:6px;color:var(--mu)}
.kek{font-size:.78rem;border:1px solid var(--ln);border-radius:99px;padding:1px 8px;font-variant-numeric:tabular-nums}
.mod{color:var(--ac)}
.empty{color:var(--mu);text-align:center;padding:32px 8px}
/* Profil */
.phero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:8px 0 16px}
.phero h2{margin:6px 0 0;font-size:1.9rem}
.phero .rel{color:var(--ac);font-family:var(--serif);font-style:italic}
.pact{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;margin:0}
.facts dt{color:var(--mu)}.facts dd{margin:0}
.prose{font-family:var(--serif);font-size:1.08rem;line-height:1.65}
.prose p{margin:0 0 .9em}
.prose blockquote{margin:0 0 1em;padding:6px 0 6px 16px;border-left:3px solid var(--ac);font-style:italic;color:var(--mu)}
.plink{color:var(--ac);text-decoration:none;border-bottom:1px dotted var(--ac);cursor:pointer}
.anek{position:relative;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px 16px 12px 44px;margin-bottom:10px;font-family:var(--serif);font-size:1.05rem}
.anek:before{content:"„";position:absolute;left:12px;top:-2px;font-size:2.6rem;color:var(--ac);font-family:var(--serif)}
.anek small{display:block;margin-top:6px;font-family:var(--sans)}
.gal{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px}
.gal button{appearance:none;border:0;padding:0;background:none;flex:none;cursor:pointer;text-align:left;width:140px}
.gal img{width:140px;height:170px;object-fit:cover;border-radius:12px;display:block;background:var(--sf2)}
.gal small{display:block;margin-top:4px;font-size:.78rem;line-height:1.3}
.fam-grid{display:flex;flex-direction:column;gap:14px}
.fam-grid h4{margin:0 0 6px;font-weight:600;font-size:.9rem;color:var(--mu)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.plk{appearance:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:4px 14px 4px 4px;cursor:pointer;min-height:44px}
.plk.add{padding:4px 14px;border-style:dashed;color:var(--mu);background:transparent}
/* Geschichten */
.sread h2{font-size:1.9rem;margin:6px 0 4px}
.smeta{color:var(--mu);font-size:.92rem;margin-bottom:16px}
.sread.erz .prose{font-size:1.15rem}
.simgs{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.simgs img{width:100%;border-radius:14px}
/* Bühne Baum/Zeit */
.stage{position:fixed;top:calc(var(--hdr) + var(--st));bottom:calc(var(--nav) + var(--sb));left:var(--rail);right:0;overflow:hidden}
@media(min-width:900px){.stage{bottom:0}}
.stage svg.cv{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.tbar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;flex-wrap:wrap;z-index:2;pointer-events:none}
.tbar>*{pointer-events:auto}
.seg{display:inline-flex;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:3px;align-items:center}
.seg button{appearance:none;border:0;background:none;border-radius:9px;padding:6px 10px;min-height:36px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:.9rem}
.seg button.on{background:var(--ac);color:var(--aci)}
.seg span{padding:0 6px;font-size:.9rem;font-variant-numeric:tabular-nums}
.zoom{position:absolute;right:10px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoom .ib{background:var(--sf);border:1px solid var(--ln)}
.fbar{position:absolute;left:10px;bottom:12px;right:70px;z-index:2;font-size:.85rem;color:var(--mu);pointer-events:none}
.fbar b{color:var(--tx);font-family:var(--serif)}
svg .cbg{fill:var(--sf);stroke:var(--ln);stroke-width:1}
svg .focus .cbg{stroke:var(--ac);stroke-width:2.5}
svg .stp.m{fill:var(--m)}svg .stp.w{fill:var(--w)}svg .stp.q{fill:var(--q)}
svg .nm{fill:var(--tx);font:600 14px var(--serif)}
svg .sn{fill:var(--tx);font:13px var(--serif)}
svg .yr{fill:var(--mu);font:11.5px var(--sans)}
svg .ini{fill:var(--tx);font:600 13px var(--serif)}
svg .avc{fill:var(--sf2);stroke-width:2}
svg .avc.m{stroke:var(--m)}svg .avc.w{stroke:var(--w)}svg .avc.q{stroke:var(--q)}
svg .ph .cbg{fill:none;stroke:var(--mu);stroke-dasharray:5 5}
svg .ph text{fill:var(--mu);font:13px var(--sans)}
svg .edge{fill:none;stroke:var(--ln);stroke-width:1.6}
svg .sec{stroke:var(--bg);stroke-width:1.5}
svg .sec.m{fill:color-mix(in srgb,var(--m) 32%,var(--sf))}
svg .sec.w{fill:color-mix(in srgb,var(--w) 32%,var(--sf))}
svg .sec.q{fill:var(--sf2)}
svg .sec.focus{fill:color-mix(in srgb,var(--ac) 45%,var(--sf))}
svg .sec.gap{fill:transparent;stroke:var(--ln);stroke-dasharray:3 4}
svg .ft{fill:var(--tx);font-family:var(--serif);pointer-events:none}
svg .ax{stroke:var(--ln)}svg .axt{fill:var(--mu);font:12px var(--sans)}
svg .ev{fill:var(--ac);opacity:.09}svg .evl{fill:var(--ac);font:12px var(--sans);opacity:.85}
svg .bar.m{fill:color-mix(in srgb,var(--m) 55%,var(--sf))}svg .bar.w{fill:color-mix(in srgb,var(--w) 55%,var(--sf))}svg .bar.q{fill:var(--sf2)}
svg .bar.est{opacity:.45}
svg .bt{fill:var(--tx);font:13px var(--serif);pointer-events:none}
svg .smk{fill:var(--ac)}
/* Overlay */
#ov{position:fixed;inset:0;z-index:50;display:none}
#ov.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88dvh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 18px calc(18px + var(--sb));animation:up .22s ease-out;border-top:1px solid var(--ln)}
.sheet.full{top:calc(var(--st) + 24px);max-height:none}
@media(min-width:700px){.sheet{left:50%;width:640px;transform:translateX(-50%);bottom:auto;top:50%;translate:0 -50%;border-radius:22px;max-height:86dvh;border:1px solid var(--ln);animation:none}.sheet.full{top:50%;height:86dvh}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.shead{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-8px;background:var(--bg);z-index:2;padding-top:6px}
.shead h3{margin:0;font-size:1.3rem}
.quick{display:flex;gap:14px;align-items:center;margin:8px 0 14px}
.quick h3{margin:0 0 2px;font-size:1.35rem}
.menu{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.form{display:flex;flex-direction:column;gap:12px;padding-top:8px}
.fld,.form label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--mu)}
.form input:not([type=checkbox]),.form select,.form textarea,.fld input,.fld select{min-height:46px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);padding:10px 12px;color:var(--tx);font-size:16px;width:100%}
.form textarea{font-family:var(--serif);line-height:1.5;resize:vertical}
.form label.chk{flex-direction:row;align-items:center;gap:10px;color:var(--tx);font-size:1rem;min-height:40px}
.chk input{width:22px;height:22px;accent-color:var(--ac)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
fieldset{border:1px solid var(--ln);border-radius:14px;padding:10px 12px;margin:0;display:flex;flex-direction:column;gap:10px}
legend{color:var(--mu);font-size:.88rem;padding:0 6px}
.arow{display:flex;flex-direction:column;gap:6px;border-bottom:1px dashed var(--ln);padding-bottom:10px}
.arow .rr{display:flex;gap:8px}
.thumbs{display:flex;flex-wrap:wrap;gap:10px}
.th{width:110px;display:flex;flex-direction:column;gap:4px;position:relative}
.th img{width:110px;height:110px;object-fit:cover;border-radius:10px}
.th input{min-height:36px!important;padding:6px 8px!important;font-size:14px!important}
.th .x{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
.btns{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.btns.sticky{position:sticky;bottom:calc(-18px - var(--sb));background:var(--bg);padding:10px 0 calc(10px + var(--sb));border-top:1px solid var(--ln)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:6px 16px 16px;margin-bottom:14px}
.card h3{margin:12px 0 10px}
details.card{padding:0 16px}
details.card summary{min-height:52px;display:flex;align-items:center;cursor:pointer;font-family:var(--serif);font-size:1.05rem;list-style:none}
details.card summary:after{content:"+";margin-left:auto;color:var(--mu);font-size:1.3rem}
details.card[open] summary:after{content:"–"}
details.card>div{padding-bottom:14px}
.use{margin:0;padding-left:18px}.use li{margin-bottom:6px}
.stack{display:flex;flex-direction:column;gap:8px}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px;color:var(--mu)}
.stats b{color:var(--tx);font-family:var(--serif);font-size:1.3rem;display:block}
.lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:12px;color:#eee}
.lb img{max-width:100%;max-height:80dvh;border-radius:8px}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--sb) + 16px);transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1}
textarea.cx{width:100%;min-height:180px;font:13px/1.4 ui-monospace,monospace;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px;color:var(--tx)}
</style>
</head>
<body>
<header><button id="back" class="ib" aria-label="Zurück" hidden><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><h1 id="ttl"></h1><div id="hact"></div></header>
<main id="main"></main>

const gen=k=>Math.floor(Math.log2(k))+1;
function kekRel(k){if(k===1)return'Hauptperson';const g=gen(k),m=k%2===0;
 if(g===2)return m?'Vater':'Mutter';
 const base=m?'großvater':'großmutter';const t=g===3?'G'+base.slice(1):g===4?'Ur'+base:g===5?'Urur'+base:`${g-3}× Ur${base}`;
 const side=((k>>(g-2))&1)?'mütterlicherseits':'väterlicherseits';return `${t} ${side}`}
function relLabel(id){const k=KEK.get(id);if(k)return kekRel(k);const p=P.get(id),pr=P.get(D.meta.proband);if(!p||!pr)return'';
 const w=p.geschlecht==='w';
 if(p.vater===pr.id||p.mutter===pr.id)return w?'Tochter':'Sohn';
 if((pr.partner||[]).includes(id))return'Partner/in';
 if((p.vater&&p.vater===pr.vater)||(p.mutter&&p.mutter===pr.mutter))return w?'Schwester':'Bruder';
 const pk=[p.vater,p.mutter].map(x=>KEK.get(x)).filter(Boolean);
 if(pk.some(k=>k>=4&&k<=7))return w?'Tante':'Onkel';
 if(pk.some(k=>k===2||k===3))return w?'Schwester':'Bruder';
 const gp=[p.vater,p.mutter].map(x=>P.get(x)).filter(Boolean);
 if(gp.some(x=>x.vater===pr.id||x.mutter===pr.id))return w?'Enkelin':'Enkel';
 return''}
function avatar(p,s){const f=p.fotos&&p.fotos[0],m=f&&MEDIA.get(f);
 if(m)return`<span class="av ${gc(p)}" style="--s:${s}px"><img src="${m.src}" alt=""></span>`;
 const i=((p.vorname||'')[0]||'')+((p.nachname||'')[0]||'');return`<span class="av ${gc(p)}" style="--s:${s}px">${esc(i||'?')}</span>`}
function md(t){if(!t)return'';
 const inl=s=>esc(s).replace(/\[\[([\w-]+)(?:\|([^\]]+))?\]\]/g,(m,id,l)=>{const p=P.get(id);const lab=l||(p?esc(nm(p)):id);return p?`<a class="plink" data-go="#person/${id}">${lab}</a>`:lab}).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
 return t.split(/\n\s*\n/).map(b=>/^>\s?/.test(b)?`<blockquote>${b.split('\n').map(l=>inl(l.replace(/^>\s?/,''))).join('<br>')}</blockquote>`:`<p>${b.split('\n').map(inl).join('<br>')}</p>`).join('')}
const plain=t=>String(t||'').replace(/\[\[([\w-]+)(?:\|([^\]]+))?\]\]/g,(m,id,l)=>l||(P.get(id)?nm(P.get(id)):'')).replace(/[*>]/g,'').replace(/\s+/g,' ').trim();

 const s=sheet(`<h3>${esc(title)}</h3>${text?`<p class="muted">${text}</p>`:''}<div class="form">${fields.map(f=>`<label class="fld"><span>${esc(f.label)}</span><input name="${f.name}" type="${f.type||'text'}" value="${esc(f.value||'')}" placeholder="${esc(f.ph||'')}" autocomplete="off"></label>`).join('')}</div><div class="btns"><button class="btn ghost" data-r="0">Abbrechen</button><button class="btn ${danger?'danger':'pri'}" data-r="1">${esc(ok)}</button></div>`);
 onClose=res;
 s.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b)return;const v={};$$('input',s).forEach(i=>v[i.name]=i.value);onClose=null;closeSheet();res(b.dataset.r==='1'?(fields.length?v:true):null)});
 s.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();$('[data-r="1"]',s).click()}});

function lightbox(mid){const m=MEDIA.get(mid);if(!m)return;const d=document.createElement('div');d.className='lb';d.innerHTML=`<img src="${m.src}" alt="">${m.caption?`<p>${esc(m.caption)}</p>`:''}<small style="color:#aaa">Tippen zum Schließen</small>`;d.onclick=()=>d.remove();document.body.appendChild(d)}

function readImage(file,max=1400){return new Promise((res,rej)=>{
 if(file.type==='image/svg+xml'){const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);return}
 const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',.82))};img.onerror=()=>rej(new Error('Bild nicht lesbar'));img.src=url})}

function facts(){const ps=D.personen.filter(p=>vis(p.id));const out=[];
 const born=ps.filter(p=>yr(p.geb)).sort((a,b)=>yr(a.geb)-yr(b.geb));
 if(born[0]){const p=born[0],k=KEK.get(p.id);out.push(`Die früheste bekannte Person ist [[${p.id}]], geboren ${yr(p.geb)}${k?`, ${gen(k)-1} Generationen vor ${esc(P.get(D.meta.proband).vorname)}`:''}.`)}
 const lived=ps.filter(p=>yr(p.geb)&&yr(p.tod)).map(p=>[p,yr(p.tod)-yr(p.geb)]).sort((a,b)=>b[1]-a[1]);
 if(lived[0])out.push(`Am längsten gelebt hat [[${lived[0][0].id}]]: ${lived[0][1]} Jahre.`);
 const ort={};ps.forEach(p=>{if(p.gebOrt)ort[p.gebOrt]=(ort[p.gebOrt]||0)+1});const top=Object.entries(ort).sort((a,b)=>b[1]-a[1])[0];
 if(top&&top[1]>1)out.push(`${top[1]} Personen wurden in ${esc(top[0])} geboren – mehr als irgendwo sonst.`);
 const t=new Date(),dm=`${t.getDate()}.${t.getMonth()+1}.`;
 ps.forEach(p=>{for(const[f,w]of[['geb','geboren'],['tod','gestorben']]){const m=String(p[f]||'').match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/);if(m&&`${+m[1]}.${+m[2]}.`===dm)out.unshift(`Heute vor ${CY-+m[3]} Jahren wurde [[${p.id}]] ${w}.`)}});
 const beruf=ps.filter(p=>p.beruf);if(beruf.length>2){const p=beruf[Math.floor(Math.random()*beruf.length)];out.push(`[[${p.id}]] war ${esc(p.beruf)}.`)}
 return out}
let factI=0,storyPick=null;
function miniFan(){const kk=new Map();for(const[id,k]of KEK)if(vis(id)&&k<32)kk.set(k,P.get(id));let r=14,s=`<circle r="12" class="sec focus"/>`;
 for(let g=2;g<=5;g++){const n=2**(g-1),r2=r+17;for(let i=0;i<n;i++){const k=n+i,p=kk.get(k);s+=`<path class="sec ${p?gc(p):'gap'}" d="${sector(r+1,r2,180+180*i/n,180+180*(i+1)/n)}"/>`}r=r2}
 return`<svg viewBox="-86 -86 172 90" aria-hidden="true">${s}</svg>`}

function panzoom(svg,g,onTap){const st={x:0,y:0,s:1},pts=new Map();let last=null,moved=0,downT=0,downEl=null;

 const snap=()=>{const a=[...pts.values()];if(!a.length)return null;if(a.length===1)return{n:1,x:a[0].x,y:a[0].y};return{n:2,x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}};
 const zoomAt=(cx,cy,f)=>{const r=svg.getBoundingClientRect(),px=cx-r.left,py=cy-r.top,ns=Math.min(4,Math.max(.08,st.s*f));f=ns/st.s;st.x=px-(px-st.x)*f;st.y=py-(py-st.y)*f;st.s=ns;apply()};
 svg.addEventListener('pointerdown',e=>{try{svg.setPointerCapture(e.pointerId)}catch(_){}pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1){moved=0;downT=Date.now();downEl=e.target}else moved=99;last=snap()});
 svg.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});const now=snap();
  if(last&&now.n===last.n){const dx=now.x-last.x,dy=now.y-last.y;st.x+=dx;st.y+=dy;moved+=Math.abs(dx)+Math.abs(dy);apply();if(now.n===2&&last.d)zoomAt(now.x,now.y,now.d/last.d)}last=now});
 const up=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
  if(!pts.size&&e.type==='pointerup'&&moved<8&&Date.now()-downT<650&&downEl){const el=downEl.closest&&downEl.closest('[data-id],[data-ph],[data-story]');if(el)onTap(el)}last=snap()};
 svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
 svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*.0018))},{passive:false});
 const api={st,apply,
  zoom(f){const r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,f)},
  fit(pad=30){const bb=g.getBBox(),w=svg.clientWidth,h=svg.clientHeight;if(!bb.width)return;st.s=Math.min(1.2,(w-2*pad)/bb.width,(h-2*pad-50)/bb.height);st.x=(w-bb.width*st.s)/2-bb.x*st.s;st.y=(h-bb.height*st.s)/2-bb.y*st.s+20;apply()},

function drawTree(g){const anc=S.tmode==='anc',hor=S.torient==='h';let leaf=0;const nodes=[],edges=[],seen=new Set();

const b64=buf=>{const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i+=32768)s+=String.fromCharCode.apply(null,b.subarray(i,i+32768));return btoa(s)};
const unb64=s=>{const t=atob(s),u=new Uint8Array(t.length);for(let i=0;i<t.length;i++)u[i]=t.charCodeAt(i);return u};
async function keyFrom(pw,salt,iter){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encrypt(obj,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),iter=250000,key=await keyFrom(pw,salt,iter);
 const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));return{format:'stammbaum-verschluesselt',v:1,iter,salt:b64(salt),iv:b64(iv),data:b64(ct)}}
async function decrypt(o,pw){const key=await keyFrom(pw,unb64(o.salt),o.iter);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.data));return JSON.parse(new TextDecoder().decode(pt))}

 if(share&&navigator.canShare){const file=new File([blob],name,{type:'application/json'});if(navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e.name==='AbortError')return}}}

ACT.imp=async()=>{const[f]=await pickFiles('.json,application/json');if(!f)return;let o;try{o=JSON.parse(await f.text())}catch(e){return toast('Keine gültige Datei')}
 if(o.format==='stammbaum-verschluesselt'){const r=await ask({title:'Passwort',fields:[{name:'pw',label:'Passwort der Familiendatei',type:'password'}],ok:'Öffnen'});if(!r)return;
  try{o=await decrypt(o,r.pw)}catch(e){return toast('Passwort falsch oder Datei beschädigt')}}
 if(o.format==='stammbaum-aenderungen')return mergeChanges(o);
 if(o.format!=='stammbaum'||!Array.isArray(o.personen))return toast('Unbekanntes Dateiformat');
 if(!await ask({title:'Datei laden?',text:`${o.personen.length} Personen und ${(o.geschichten||[]).length} Geschichten ersetzen die Daten auf diesem Gerät${modCount()?` – darunter ${modCount()} nicht exportierte Änderungen`:''}.`,ok:'Ersetzen',danger:!!modCount()}))return;
 await loadDataset(o);toast('Geladen');location.hash='#start'};
async function mergeChanges(o){if(!await ask({title:'Änderungen übernehmen?',text:`${(o.personen||[]).length} Personen, ${(o.geschichten||[]).length} Geschichten, ${(o.geloescht||[]).length} gelöscht${o.familie?` (aus „${esc(o.familie)}“)`:''}.`,ok:'Übernehmen'}))return;
 for(const p of o.personen||[]){const i=D.personen.findIndex(x=>x.id===p.id);if(i>=0)D.personen[i]=p;else D.personen.push(p)}
 for(const g of o.geschichten||[]){const i=D.geschichten.findIndex(x=>x.id===g.id);if(i>=0)D.geschichten[i]=g;else D.geschichten.push(g)}
 const del=new Set(o.geloescht||[]);D.personen=D.personen.filter(p=>!del.has(p.id));D.geschichten=D.geschichten.filter(g=>!del.has(g.id));
 D.geloescht=[...new Set([...D.geloescht,...del])];if(o.meta)Object.assign(D.meta,o.meta,{_mod:'geändert'});
 for(const[k,v]of Object.entries(o.media||{}))await putMedia(k,v);await saveD();index();toast('Übernommen');route()}
async function loadDataset(o){D={meta:{...o.meta},personen:o.personen||[],geschichten:o.geschichten||[],geloescht:o.geloescht||[]};
 MEDIA.clear();try{await DB.clear('media')}catch(e){}for(const[k,v]of Object.entries(o.media||{}))await putMedia(k,v);
 S.focus=null;saveS();await saveD();index()}
ACT.reset=async({k})=>{if(!await ask({title:k==='demo'?'Beispieldaten laden?':'Leere Familie anlegen?',text:'Die Daten auf diesem Gerät werden ersetzt.',ok:'Ersetzen',danger:true}))return;
 if(k==='demo')await loadDataset(JSON.parse($('#data').textContent));
 else{await loadDataset({meta:{titel:'Unsere Familie',untertitel:'',proband:'n1'},personen:[{id:'n1',vorname:'Ich',nachname:'',geschlecht:'?',partner:[],anekdoten:[],fotos:[],_mod:'neu'}],geschichten:[],media:{}});history.replaceState(null,'','#start');route();personForm('n1');return}
 history.replaceState(null,'','#start');route()};

/* ---------- Start ---------- */
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a&&!a.disabled){e.preventDefault();const f=ACT[a.dataset.act];if(f)f({...a.dataset},a,e);return}
 const g=e.target.closest('[data-go]');if(g){e.preventDefault();if(location.hash===g.dataset.go)route();else location.hash=g.dataset.go}});
$('#back').addEventListener('click',()=>history.length>1?history.back():(location.hash='#start'));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#ov').classList.contains('open'))closeSheet()});
window.addEventListener('hashchange',route);
let rT;window.addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{if(['baum','zeit'].includes(CUR.r))VIEWS[CUR.r](CUR.id)},200)});
(async function init(){applyTheme();
 try{await DB.open();D=await DB.get('kv','dataset');for(const[k,v]of await DB.all('media'))MEDIA.set(k,v)}catch(e){DB.ok=false;toast('Kein dauerhafter Speicher verfügbar – bitte Sicherung nutzen')}
 if(!D){const o=JSON.parse($('#data').textContent);D={meta:{...o.meta},personen:o.personen,geschichten:o.geschichten,geloescht:[]};for(const[k,v]of Object.entries(o.media||{}))MEDIA.set(k,v);
  if(DB.ok){await saveD();for(const[k,v]of MEDIA)await DB.put('media',k,v)}}
 D.geloescht=D.geloescht||[];index();route();
 if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script>
