[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 var(--font);-webkit-tap-highlight-color:transparent}
body{padding:calc(var(--hdr) + var(--st)) 0 calc(var(--nav) + var(--sb)) var(--rail)}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--ac2);outline-offset:2px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.s{width:17px;height:17px}
header{position:fixed;top:0;left:var(--rail);right:0;z-index:20;height:calc(var(--hdr) + var(--st));padding:var(--st) 6px 0;display:flex;align-items:center;gap:2px;background:color-mix(in srgb,var(--bg) 85%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
header h1{flex:1;margin:0 8px;font-weight:800;font-size:1.15rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hact{display:flex;gap:2px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;height:calc(var(--nav) + var(--sb));padding:6px 8px var(--sb);display:flex;gap:4px;background:var(--sf);box-shadow:0 -1px 0 var(--ln)}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mu);text-decoration:none;font-size:.72rem;font-weight:700;border-radius:16px}
nav a .i{width:24px;height:24px}
nav a.on{color:var(--ac);background:color-mix(in srgb,var(--ac) 13%,transparent)}
@media(min-width:900px){:root{--rail:92px}body{padding-bottom:0}nav{top:0;right:auto;width:92px;height:auto;flex-direction:column;justify-content:flex-start;padding:calc(var(--st) + 72px) 10px 0;box-shadow:1px 0 0 var(--ln)}nav a{flex:0 0 72px}}
main{max-width:760px;margin:0 auto;padding:14px 18px 40px}
.ib{appearance:none;border:0;background:transparent;width:44px;height:44px;border-radius:14px;display:inline-grid;place-items:center;cursor:pointer;font-size:1.2rem;flex:none}
.ib:active{background:var(--sf2)}
.btn{appearance:none;border:0;background:var(--sf2);border-radius:14px;min-height:48px;padding:10px 16px;display:inline-flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;text-align:left;font-weight:700}
.btn.pri{background:var(--ac);color:var(--aci)}
.btn.danger{background:var(--bad);color:#fff}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ln)}
.btn.sm{min-height:40px;padding:6px 13px;font-size:.92rem}
.btn.wide{width:100%;justify-content:flex-start}
.btn small{display:block;font-weight:400;margin-top:1px}
.btn .bt2{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.btn:disabled{opacity:.45}
.muted,small{color:var(--mu)}
h2,h3,h4{font-weight:800;line-height:1.2}
h3.sec{font-size:1.15rem;margin:30px 0 10px;display:flex;align-items:baseline;gap:10px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:800;border-radius:99px;padding:2px 9px;background:var(--sf2);color:var(--mu)}
.pill.draft{background:color-mix(in srgb,var(--ac2) 25%,transparent);color:color-mix(in srgb,var(--ac2) 60%,var(--tx))}
.num{font-size:.8rem;font-weight:800;color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent);border-radius:99px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
/* Avatare */
.av{width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;flex:none;overflow:hidden;font-weight:800;font-size:calc(var(--s)*.36);background:var(--sf2);color:var(--tx);box-shadow:0 0 0 2.5px var(--sf),0 0 0 calc(2.5px + max(2px,var(--s)*.04)) var(--q)}
.av.m{box-shadow:0 0 0 2.5px var(--sf),0 0 0 calc(2.5px + max(2px,var(--s)*.04)) var(--m);background:color-mix(in srgb,var(--m) 16%,var(--sf))}
.av.w{box-shadow:0 0 0 2.5px var(--sf),0 0 0 calc(2.5px + max(2px,var(--s)*.04)) var(--w);background:color-mix(in srgb,var(--w) 16%,var(--sf))}
.av.d{box-shadow:0 0 0 2.5px var(--sf),0 0 0 calc(2.5px + max(2px,var(--s)*.04)) var(--d);background:color-mix(in srgb,var(--d) 16%,var(--sf))}
.av img{width:100%;height:100%;object-fit:cover}
/* Start */
.hero{display:flex;gap:18px;align-items:center;padding:10px 0 6px}
.wappen{appearance:none;background:none;border:0;padding:0;width:100px;height:116px;flex:none;cursor:pointer;display:grid;place-items:center;transform:rotate(-4deg)}
.wappen img{max-width:100%;max-height:100%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.wappen.empty{border:2px dashed var(--ln);border-radius:16px 16px 50% 50%;color:var(--mu);gap:4px;align-content:center;font-size:.8rem;transform:none}
.fam{font-size:clamp(2.1rem,9vw,3rem);font-weight:900;margin:0;line-height:1;letter-spacing:-.01em}
.sub{margin:6px 0 0;color:var(--mu);font-weight:600}
.note{background:color-mix(in srgb,var(--ac2) 18%,var(--sf));padding:12px 16px;border-radius:16px;margin:14px 0;font-size:.95rem}
.note button{appearance:none;border:0;background:none;color:var(--ac);font-weight:800;text-decoration:underline;padding:0;cursor:pointer}
.treecard{appearance:none;border:0;width:100%;display:flex;align-items:center;gap:14px;background:var(--ac);color:var(--aci);border-radius:24px;padding:14px 18px;cursor:pointer;text-align:left;margin-top:16px}
.treecard svg{width:92px;flex:none}
.treecard>div{min-width:0;flex:1}
.treecard h3{margin:0 0 2px;font-size:1.35rem;font-weight:900}.treecard p{margin:0;opacity:.85;font-size:.95rem}
.treecard .sec{stroke:var(--ac)}
.treecard .sec.m{fill:color-mix(in srgb,#fff 70%,var(--m))}.treecard .sec.w{fill:color-mix(in srgb,#fff 70%,var(--w))}.treecard .sec.d{fill:color-mix(in srgb,#fff 70%,var(--d))}.treecard .sec.q{fill:#fff}.treecard .sec.focus{fill:var(--ac2)}
.treecard .sec.gap{fill:none;stroke:color-mix(in srgb,#fff 45%,transparent);stroke-dasharray:2 3}
.strip{display:flex;gap:16px;overflow-x:auto;padding:6px 18px 12px;margin:0 -18px;scroll-snap-type:x proximity}
.pchip{appearance:none;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;scroll-snap-align:start;width:80px;flex:none;padding:0}
.pchip span{font-weight:800;font-size:.92rem;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip small{font-size:.75rem;text-align:center;line-height:1.2;margin-top:-6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{appearance:none;border:0;background:var(--t-thema);border-radius:20px;padding:14px;min-height:96px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:8px;font-weight:800;font-size:1rem;overflow:hidden;position:relative}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.tile.img span{position:relative;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.tile.img:after{content:"";position:absolute;inset:40% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.tile.img span{z-index:1}
.tile .i{color:var(--ac)}
.story{display:block;border-radius:22px;cursor:pointer;margin-bottom:14px;overflow:hidden;background:var(--sf);box-shadow:var(--shadow)}
.story .simg.ct,.tile img.ct{object-fit:contain;padding:14px;background:var(--sf2)}
.story .simg{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--sf2)}
.story .sbody{padding:14px 16px 12px}
.story.thema .sbody{background:var(--t-thema)}.story.archiv .sbody{background:var(--t-archiv)}.story.erzaehlung .sbody{background:var(--t-erz)}
.story h3{margin:4px 0 6px;font-size:1.25rem}
.story p{margin:0;color:var(--mu);line-height:1.5}
.kind{display:flex;align-items:center;gap:6px;font-size:.84rem;color:var(--mu);font-weight:700;flex-wrap:wrap}
.kind .i{color:var(--ac)}
.sfoot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;min-height:32px}
.faces{display:flex}.faces .av{margin-right:-6px}
.fact{display:flex;gap:12px;align-items:flex-start;background:var(--sf);border-radius:20px;padding:16px 8px 16px 18px;box-shadow:var(--shadow)}
.fact p{margin:0;flex:1;font-size:1.05rem}
.fbtn{display:flex;flex-direction:column;gap:2px}
.fbtn .ib{width:38px;height:38px}
/* Liste */
.search{position:relative;margin-bottom:10px}
.search input{width:100%;min-height:50px;border-radius:16px;border:0;background:var(--sf);box-shadow:inset 0 0 0 1.5px var(--ln);padding:10px 14px 10px 44px;font-size:16px}
.search .i{position:absolute;left:14px;top:14px;color:var(--mu)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 12px;padding:2px 18px}
.chip{appearance:none;border:0;background:var(--sf);box-shadow:inset 0 0 0 1.5px var(--ln);border-radius:99px;padding:8px 15px;white-space:nowrap;cursor:pointer;font-size:.92rem;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ac);box-shadow:none;color:var(--aci)}
.plist{list-style:none;margin:0;padding:0}
.prow{appearance:none;width:100%;display:flex;align-items:center;gap:14px;background:none;border:0;padding:10px 4px;text-align:left;cursor:pointer;min-height:68px;border-radius:16px}
.prow:active{background:var(--sf2)}
.pm{flex:1;min-width:0}.pm b{display:block;font-size:1.05rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt{display:flex;align-items:center;gap:6px;color:var(--mu)}
.mod{color:var(--ac2)}
.empty{color:var(--mu);text-align:center;padding:32px 8px}
/* Profil */
.phero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:8px 0 18px}
.phero .ph-img{appearance:none;border:0;padding:0;background:none;cursor:pointer;border-radius:50%}
.phero h2{margin:12px 0 0;font-size:2rem;font-weight:900}
.phero .rel{font-weight:800;color:var(--ac)}
.pact{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;background:var(--sf);border-radius:20px;padding:16px 18px;margin:0;box-shadow:var(--shadow)}
.facts dt{color:var(--mu);font-weight:700}.facts dd{margin:0}
.prose{font-size:1.07rem;line-height:1.7}
.prose p{margin:0 0 .9em}
.prose blockquote{margin:0 0 1em;padding:10px 16px;border-radius:14px;background:var(--sf2);font-style:italic}
.plink{color:var(--ac);font-weight:700;text-decoration:none;background:color-mix(in srgb,var(--ac) 10%,transparent);border-radius:6px;padding:0 3px;cursor:pointer}
.anek{position:relative;background:var(--sf);border-radius:20px;padding:16px 18px 12px 50px;margin-bottom:12px;box-shadow:var(--shadow);font-size:1.05rem}
.anek:before{content:"„";position:absolute;left:16px;top:-14px;font-size:3.2rem;font-weight:900;color:var(--ac2)}
.anek small{display:block;margin-top:6px;font-weight:700}
.gal{display:flex;gap:12px;overflow-x:auto;margin:0 -18px;padding:4px 18px 10px;scroll-snap-type:x proximity}
.gal button{appearance:none;border:0;padding:8px 8px 10px;background:var(--sf);flex:none;cursor:pointer;text-align:left;width:150px;border-radius:6px;box-shadow:var(--shadow);scroll-snap-align:start}
.gal button:nth-child(odd){transform:rotate(-1.5deg)}.gal button:nth-child(even){transform:rotate(1.2deg)}
.gal img{width:134px;height:160px;object-fit:cover;display:block;background:var(--sf2)}
.gal small{display:block;margin-top:6px;font-size:.82rem;line-height:1.25;color:var(--tx)}
.fam-grid{display:flex;flex-direction:column;gap:16px}
.fam-grid h4{margin:0 0 8px;font-size:.92rem;color:var(--mu)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.plk{appearance:none;border:0;display:inline-flex;align-items:center;gap:9px;background:var(--sf);box-shadow:var(--shadow);border-radius:99px;padding:5px 15px 5px 5px;cursor:pointer;min-height:46px;font-weight:700;text-align:left}
.plk small{font-weight:400}
.plk.add{padding:5px 15px;box-shadow:inset 0 0 0 1.5px var(--ln);background:transparent;color:var(--mu);border:0}
/* Geschichte lesen */
.shero{margin:-14px -18px 16px;position:relative}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory}
.car figure{margin:0;flex:0 0 100%;scroll-snap-align:center;position:relative}
.car img{width:100%;max-height:62dvh;object-fit:cover;display:block;cursor:zoom-in}
.car figcaption{position:absolute;left:12px;bottom:10px;right:60px;color:#fff;font-weight:700;font-size:.9rem;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.dots{position:absolute;bottom:8px;right:12px;display:flex;gap:5px}.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55)}
.sread h2{font-size:2rem;font-weight:900;margin:6px 0 4px}
.smeta{color:var(--mu);margin-bottom:16px}
.listen{background:var(--t-erz);border-radius:20px;padding:12px 14px;margin-bottom:18px;display:flex;flex-direction:column;gap:8px}
.listen b{display:flex;align-items:center;gap:8px}
audio{width:100%;height:44px}
.att{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.att button{appearance:none;border:0;padding:0;background:none;cursor:pointer;text-align:left}
.att img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;display:block}
.att small{display:block;font-size:.8rem;margin-top:3px}
.vid{margin-bottom:12px}.vid video{width:100%;border-radius:14px;background:#000}
.lnk{appearance:none;border:0;width:100%;cursor:pointer;text-align:left;font:inherit;display:flex;align-items:center;gap:10px;background:var(--sf);border-radius:16px;padding:12px 14px;color:var(--tx);text-decoration:none;box-shadow:var(--shadow);margin-bottom:8px;font-weight:700;word-break:break-word}
/* Bühne */
.stage{position:fixed;top:calc(var(--hdr) + var(--st));bottom:calc(var(--nav) + var(--sb));left:var(--rail);right:0;overflow:hidden;background:var(--treebg) center bottom/min(1200px,140%) auto no-repeat,var(--bg)}
@media(min-width:900px){.stage{bottom:0}}
.stage svg.cv{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.tbar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:2;pointer-events:none}
.tbar>*{pointer-events:auto}
.fab{appearance:none;border:0;background:var(--sf);box-shadow:var(--shadow);border-radius:16px;min-height:46px;padding:8px 14px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:800}
.fab.focus{background:var(--ac2);color:#2a1d00}
.zoom{position:absolute;right:12px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:2}
.zoom .ib{background:var(--sf);box-shadow:var(--shadow);width:48px;height:48px}
.fbar{position:absolute;left:12px;bottom:14px;right:76px;z-index:2;font-size:.85rem;color:var(--mu);pointer-events:none;font-weight:700}
.seg{display:inline-flex;background:var(--sf2);border-radius:14px;padding:4px;align-items:center;gap:2px}
.seg button{appearance:none;border:0;background:none;border-radius:11px;padding:7px 12px;min-height:40px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:.95rem;font-weight:700}
.seg button.on{background:var(--sf);box-shadow:var(--shadow);color:var(--ac)}
.seg span{padding:0 8px;font-weight:800;font-variant-numeric:tabular-nums}
.tsr{display:flex;flex-direction:column;margin-top:4px}
.tsr button{appearance:none;border:0;background:none;display:flex;align-items:center;gap:12px;padding:8px 4px;border-radius:12px;cursor:pointer;text-align:left}
.tsr button:active{background:var(--sf2)}
.opt{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.opt h4{margin:0;font-size:.9rem;color:var(--mu)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;font-weight:700;cursor:pointer}
.sw input{appearance:none;width:52px;height:30px;border-radius:99px;background:var(--ln);position:relative;cursor:pointer;flex:none;transition:background .15s}
.sw input:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.sw input:checked{background:var(--ac)}.sw input:checked:after{left:25px}
.sw small{display:block;font-weight:400}
/* SVG */
svg .cbg{fill:var(--sf);filter:url(#sh)}
svg .coll .cbg{fill:var(--sf3)}
svg .sp .cbg{fill:var(--sf3);stroke:var(--ln);stroke-dasharray:4 4;filter:none}
svg .card.est{opacity:.75}svg .card.est .yr{font-style:italic}
svg .card.focus .cbg,svg .card.hit .cbg{stroke:var(--ac2);stroke-width:3}
svg .card.hit .cbg{animation:hit 1.2s ease-out 2}
@keyframes hit{50%{stroke-width:7}}
svg .nm{fill:var(--tx);font:800 13.5px var(--font)}
svg .sn{fill:var(--tx);font:500 12.5px var(--font)}
svg .yr{fill:var(--mu);font:600 11px var(--font)}
svg .nb{fill:var(--ac);font:800 10.5px var(--font)}
svg .ini{fill:var(--tx);font:800 13px var(--font)}
svg .avc{stroke-width:2.5}
svg .avc.m{stroke:var(--m);fill:color-mix(in srgb,var(--m) 16%,var(--sf))}svg .avc.w{stroke:var(--w);fill:color-mix(in srgb,var(--w) 16%,var(--sf))}svg .avc.d{stroke:var(--d);fill:color-mix(in srgb,var(--d) 16%,var(--sf))}svg .avc.q{stroke:var(--q);fill:var(--sf2)}
svg .ph .cbg{fill:color-mix(in srgb,var(--sf) 50%,transparent);stroke:var(--mu);stroke-dasharray:5 5;filter:none}
svg .ph text{fill:var(--mu);font:700 13px var(--font)}
svg .edge{fill:none;stroke:color-mix(in srgb,var(--ac) 55%,var(--ln));stroke-width:2;stroke-linejoin:round}
svg .marr{stroke:var(--ac2);stroke-width:2.5}
svg .sec{stroke:var(--bg);stroke-width:2}
svg .sec.m{fill:color-mix(in srgb,var(--m) 28%,var(--sf))}svg .sec.w{fill:color-mix(in srgb,var(--w) 28%,var(--sf))}svg .sec.d{fill:color-mix(in srgb,var(--d) 28%,var(--sf))}svg .sec.q{fill:var(--sf2)}
svg .sec.focus{fill:var(--ac2)}
svg .sec.gap{fill:color-mix(in srgb,var(--sf) 35%,transparent);stroke:var(--ln);stroke-dasharray:3 4}
svg .ft{fill:var(--tx);font-family:var(--font);pointer-events:none}
svg .ax{stroke:var(--ln)}svg .axt{fill:var(--mu);font:700 12px var(--font)}
svg .ev{fill:color-mix(in srgb,var(--mu) 22%,transparent)}svg .evl{fill:var(--mu);font:700 11.5px var(--font)}
svg .spill rect{stroke:var(--sf);stroke-width:2;filter:url(#sh)}svg .spill text{font:800 13px var(--font);fill:var(--tx);pointer-events:none}svg .spill circle{fill:var(--sf)}
svg .spill.thema rect{fill:color-mix(in srgb,var(--ac) 30%,var(--sf))}svg .spill.archiv rect{fill:color-mix(in srgb,var(--ac2) 40%,var(--sf))}svg .spill.erzaehlung rect{fill:color-mix(in srgb,var(--w) 40%,var(--sf))}
svg .sline{stroke-width:1.5;stroke-dasharray:3 4}svg .sline.thema{stroke:var(--ac)}svg .sline.archiv{stroke:var(--ac2)}svg .sline.erzaehlung{stroke:var(--w)}
svg .bar.m{fill:color-mix(in srgb,var(--m) 45%,var(--sf))}svg .bar.w{fill:color-mix(in srgb,var(--w) 45%,var(--sf))}svg .bar.d{fill:color-mix(in srgb,var(--d) 45%,var(--sf))}svg .bar.q{fill:var(--sf2)}
svg .bar.est{opacity:.45}
svg .bt{fill:var(--tx);font:700 13px var(--font);pointer-events:none}
svg .smk{fill:var(--ac2);stroke:var(--sf);stroke-width:2}
/* Overlay */
#ov{position:fixed;inset:0;z-index:50;display:none}
#ov.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(20,30,24,.42)}
.scrim:has(+ .sheet.tmenu){background:rgba(20,30,24,.1)}
.sheet.tmenu{max-height:62dvh}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88dvh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:6px 18px calc(18px + var(--sb));animation:up .22s ease-out}
.sheet:before{content:"";display:block;width:42px;height:5px;border-radius:9px;background:var(--ln);margin:4px auto 6px}
.sheet.full{top:calc(var(--st) + 22px);max-height:none}
@media(min-width:700px){.sheet{left:50%;width:620px;transform:translateX(-50%);bottom:auto;top:50%;translate:0 -50%;border-radius:26px;max-height:86dvh;animation:none}.sheet.full{top:50%;height:86dvh}.sheet:before{display:none}}
@media(min-width:700px){.sheet.tmenu{left:auto;right:16px;top:calc(var(--hdr) + var(--st) + 12px);bottom:auto;transform:none;translate:none;width:380px;max-height:calc(100dvh - var(--hdr) - 40px)}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}svg .card.hit .cbg{animation:none}}
.shead{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-6px;background:var(--bg);z-index:2;padding-top:4px}
.shead h3{margin:0;font-size:1.3rem}
.quick{display:flex;gap:16px;align-items:center;margin:6px 0 14px}
.quick h3{margin:0 0 2px;font-size:1.35rem}
.menu{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.form{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.fld,.form label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--mu);font-weight:700}
.form input:not([type=checkbox]),.form select,.form textarea,.fld input,.fld select,.sheet select{min-height:48px;border-radius:14px;border:0;box-shadow:inset 0 0 0 1.5px var(--ln);background:var(--sf);padding:10px 12px;color:var(--tx);font-size:16px;width:100%;font-weight:500}
.form textarea{line-height:1.55;resize:vertical}
.form label.chk{flex-direction:row;align-items:center;gap:10px;color:var(--tx);font-size:1rem;min-height:40px}
.chk input{width:22px;height:22px;accent-color:var(--ac)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
fieldset{border:0;background:var(--sf3);border-radius:18px;padding:12px;margin:0;display:flex;flex-direction:column;gap:10px}
legend{float:left;width:100%;color:var(--mu);font-size:.88rem;font-weight:800;padding:0}
legend small{font-weight:400}
.arow{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:1.5px dashed var(--ln)}
.arow .rr{display:flex;gap:8px}
.thumbs{display:flex;flex-wrap:wrap;gap:10px}
.th{width:112px;display:flex;flex-direction:column;gap:4px;position:relative}
.th img,.th .tph{width:112px;height:112px;object-fit:cover;border-radius:12px;background:var(--sf2);display:grid;place-items:center;color:var(--mu)}
.th input{min-height:36px!important;padding:6px 8px!important;font-size:14px!important}
.th .x{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btns{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.btns.sticky{position:sticky;bottom:calc(-18px - var(--sb));background:var(--bg);padding:10px 0 calc(10px + var(--sb))}
.rec{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px;background:var(--t-erz);border-radius:20px}
.recbtn{appearance:none;border:0;width:84px;height:84px;border-radius:50%;background:var(--bad);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 0 0 6px color-mix(in srgb,var(--bad) 25%,transparent)}
.recbtn.on{animation:pulse 1.4s infinite}.recbtn .i{width:34px;height:34px}
@keyframes pulse{50%{box-shadow:0 0 0 16px color-mix(in srgb,var(--bad) 10%,transparent)}}
.rect{font-size:1.6rem;font-weight:900;font-variant-numeric:tabular-nums}
/* Info */
.card{background:var(--sf);border-radius:22px;padding:6px 18px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{margin:14px 0 10px}
.card p{margin:.4em 0}
details.card{padding:0 18px}
details.card summary{min-height:56px;display:flex;align-items:center;cursor:pointer;font-weight:800;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary:after{content:"+";margin-left:auto;color:var(--mu);font-size:1.4rem}
details.card[open] summary:after{content:"–"}
details.card>div{padding-bottom:16px}
.use{margin:0;padding-left:20px}.use li{margin-bottom:6px}
.stack{display:flex;flex-direction:column;gap:8px}
.stats{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:12px;color:var(--mu);font-size:.9rem}
.stats b{color:var(--tx);font-size:1.4rem;font-weight:900;display:block}
.lb{position:fixed;inset:0;z-index:60;background:rgba(10,14,12,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:12px;color:#eee}
.lb img{max-width:100%;max-height:80dvh;border-radius:10px}
.lb p{font-weight:700;margin:0}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--sb) + 16px);transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:14px;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;font-weight:700}
#toast.on{opacity:1}
textarea.cx{width:100%;min-height:160px;font:13px/1.4 ui-monospace,monospace;background:var(--sf);border:0;box-shadow:inset 0 0 0 1.5px var(--ln);border-radius:14px;padding:10px;color:var(--tx)}
code{background:var(--sf2);border-radius:6px;padding:0 4px;font-size:.9em}

/* Druck / Heft */
#print{display:none}
@media print{
 body>*:not(#print){display:none!important}
 html,body{background:#fff!important;color:#1d2721}
 body{padding:0!important;font-size:10.5pt;line-height:1.45}
 #print{display:block}
 .pg{break-after:page}
 .pg:last-child{break-after:auto}
 #print h1{font-size:30pt;font-weight:900;margin:12mm 0 4mm}
 #print h2{font-size:17pt;font-weight:900;margin:0 0 5mm;color:#3B7A4E}
 #print h3{font-size:12pt;margin:6mm 0 2mm;break-after:avoid}
 #print .title{text-align:center;padding-top:40mm}
 #print .title img{width:45mm}
 #print .st{color:#647268}
 #print table{width:100%;border-collapse:collapse;font-size:9pt;margin-bottom:3mm}
 #print th{text-align:left;border-bottom:1.5pt solid #3B7A4E;padding:1.5mm 2mm}
 #print td{border-bottom:.5pt solid #D3DDCB;padding:1.5mm 2mm;vertical-align:top}
 #print tr{break-inside:avoid}
 #print td:first-child{color:#3B7A4E;font-weight:800;white-space:nowrap}
 #print .pfan{width:100%;height:auto}
 #print .por{display:flex;gap:5mm;break-inside:avoid;margin-bottom:6mm}
 #print .por img{width:30mm;height:36mm;object-fit:cover;border-radius:2mm}
 #print .por .rel{color:#3B7A4E;font-weight:700;margin:0 0 2mm}
 #print blockquote{margin:2mm 0;padding-left:4mm;border-left:2pt solid #E2A22C;font-style:italic}
 #print .gs{margin-bottom:8mm}
 #print .gs .meta{color:#647268;margin:0 0 3mm}
 #print .gs .ti{width:100%;max-height:90mm;object-fit:cover;border-radius:2mm;margin-bottom:3mm}
 #print .ti.ct{object-fit:contain;max-height:50mm}
 #print .pics{display:grid;grid-template-columns:repeat(3,1fr);gap:2mm}
 #print .pics img{width:100%;aspect-ratio:1;object-fit:cover}
 #print .plink{background:none;color:inherit;padding:0}
 body.a5{font-size:9pt}
 body.a5 #print h1{font-size:22pt}
}

/* Zeit-Tab, Karte, Fragen */
.ztop{position:sticky;top:calc(var(--hdr) + var(--st));z-index:5;background:var(--bg);padding:6px 0 10px;margin-top:-6px}
.seg.ztabs{background:var(--sf);box-shadow:var(--shadow)}
.ztabs button{padding:7px 10px}
.today{background:color-mix(in srgb,var(--ac2) 18%,var(--sf));border-radius:20px;padding:4px 12px 6px;margin-bottom:6px}
.today h3{display:flex;gap:8px;align-items:center;margin:10px 4px 2px}
svg .land{fill:var(--sf);stroke:color-mix(in srgb,var(--ac) 35%,var(--ln));stroke-width:1.2;vector-effect:non-scaling-stroke}

.genh{font-size:.82rem;font-weight:800;color:var(--mu);text-transform:none;margin:14px 2px 6px}
.qcard{background:var(--sf);border-radius:18px;padding:12px 10px 6px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.qrow{display:flex;align-items:center;gap:4px;border-top:1px solid var(--ln)}
.qrow label{flex:1;display:flex;gap:10px;align-items:flex-start;padding:10px 0;cursor:pointer}
.qrow input{width:20px;height:20px;accent-color:var(--ac);margin-top:2px;flex:none}
.qbar{position:sticky;bottom:calc(var(--nav) + var(--sb) + 10px);display:flex;gap:8px;justify-content:center;margin-top:16px}
.qbar .btn{box-shadow:var(--shadow)}
@media(min-width:900px){.qbar{bottom:12px}}
.plink.slink{background:color-mix(in srgb,var(--ac2) 18%,transparent);color:color-mix(in srgb,var(--ac2) 55%,var(--tx))}
.fab.evbtn{padding:8px 12px}.fab.evbtn.on{background:var(--ac);color:var(--aci)}

/* Collage, Karte */
.coll{display:grid;gap:3px;aspect-ratio:16/9;background:var(--sf)}
.coll img{width:100%;height:100%;object-fit:cover;display:block;min-height:0}
.coll img.ct{object-fit:contain;padding:8px;background:var(--sf2)}
.coll.n2{grid-template-columns:1fr 1fr}
.coll.n3{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}
.coll.n3 img:first-child{grid-row:1/3}
.coll{position:relative}.coll span{position:absolute;right:10px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-weight:800;border-radius:99px;padding:2px 10px;font-size:.85rem}
.stage.map{background:var(--sea)}
:root{--sea:#DCE9EC}[data-theme=dark]{--sea:#152328}
svg .world{fill:var(--sf);stroke:color-mix(in srgb,var(--mu) 45%,var(--sf));stroke-width:.8;vector-effect:non-scaling-stroke;stroke-linejoin:round}
svg .deland{fill:color-mix(in srgb,var(--ac) 7%,var(--sf));stroke:none}
svg .st{fill:none;stroke:color-mix(in srgb,var(--ac) 30%,var(--sf));stroke-width:.8;stroke-dasharray:3 3;vector-effect:non-scaling-stroke;stroke-linejoin:round}
svg .deo{fill:none;stroke:color-mix(in srgb,var(--ac) 55%,var(--sf));stroke-width:1.4;vector-effect:non-scaling-stroke;stroke-linejoin:round}
svg .mk.s circle{fill:color-mix(in srgb,var(--ac2) 85%,transparent)}
svg .mk.b circle{stroke:var(--ac2);stroke-width:3.5}
.fbar .lg{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 3px 0 6px;vertical-align:-1px}.fbar .lg.p{background:var(--ac)}.fbar .lg.s{background:var(--ac2)}
.fbar{pointer-events:none}

eis in den Kirchenbüchern ist die Taufe von [[n16|Caspar]] 1771.\n\n> Hier können eigene Funde zur Namensforschung stehen, mit Quelle."}, {"id": "g2", "titel": "Das Familienwappen", "typ": "thema", "jahr": "", "quelle": "", "erzaehlt": "", "personen": [], "bilder": ["m1"], "anhang": [], "privat": false, "text": "Beispielwappen: In Grün ein goldenes Lindenblatt über einem silbernen Wellenbalken.\n\nDas Lindenblatt steht für den Namen, der Wellenbalken für den Bach am alten Hof."}, {"id": "g3", "titel": "Die Familie in der NS-Zeit", "typ": "thema", "jahr": "1933", "orte": ["Witebsk"], "quelle": "Landesarchiv (Beispiel)", "erzaehlt": "", "personen": ["n8", "n10"], "bilder": [], "anhang": [{"typ": "link", "url": "https://www.archive.nrw.de", "titel": "Landesarchiv NRW"}], "privat": false, "text": "Beispielaufbau für ein sensibles Kapitel: was belegt ist, was erzählt wird, und was offen bleibt.\n\n**Belegt:** [[n10|Franz Brune]] wurde 1940 eingezogen und fiel 1944. Für [[n8|Wilhelm]] gibt es eine Akte aus dem Entnazifizierungsverfahren (Signatur hier eintragen).\n\n**Erzählt:** Was in der Familie darüber gesagt wurde – getrennt von den Belegen.\n\n**Offen:** Fragen, die noch zu klären sind."}, {"id": "g4", "titel": "Taufe im Kirchenbuch", "typ": "archiv", "jahr": "1771", "quelle": "Taufbuch St. Regina, Rhynern (Beispiel)", "erzaehlt": "", "personen": ["n16"], "bilder": [], "anhang": [], "privat": false, "text": "Der früheste Eintrag zur Familie. Transkription (Beispiel):\n\n> Den 3. März ist getauft Caspar, des Heuerlings Johann Lindhorst und der Anna Maria eheleiblicher Sohn.\n\nDie Eltern von [[n16|Caspar]] sind damit namentlich bekannt, aber noch nicht eingetragen."}, {"id": "g5", "titel": "Die Hofübergabe", "typ": "archiv", "jahr": "1912", "quelle": "Grundakte, Amtsgericht Hamm (Beispiel)", "erzaehlt": "", "personen": ["n14", "n12"], "bilder": [], "anhang": [], "privat": false, "text": "Kurz vor seinem Tod übergab [[n14|Bernhard]] den Hof an seinen Sohn [[n12|August]]. Im Übergabevertrag ist genau festgehalten, was dem Altenteiler zusteht: ein Zimmer, eine Kuh, zwei Zentner Roggen im Jahr."}, {"id": "g6", "titel": "Der Hochwasserwinter", "typ": "erzaehlung", "jahr": "1946", "orte": ["Rhynern"], "quelle": "", "erzaehlt": "Gertrud", "personen": ["n5", "n8"], "bilder": [], "anhang": [], "privat": false, "text": "Im Februar stand das Wasser bis an die Stalltür. Wir haben die Hühner auf den Heuboden getragen, eins nach dem anderen, und Vater hat die ganze Nacht gepumpt.\n\nAm Morgen kam [[n8|Wilhelm Lindhorst]] vom Nachbarhof mit dem Kahn vorbei und brachte Brot. Da habe ich zum ersten Mal den Heinrich gesehen – er saß hinten im Boot und war ganz nass."}, {"id": "g7", "titel": "Opas Trecker", "typ": "erzaehlung", "jahr": "1978", "quelle": "", "erzaehlt": "Thomas", "personen": ["n4", "n2"], "bilder": [], "anhang": [], "privat": false, "text": "Der rote Trecker durfte von niemandem gefahren werden außer von [[n4|Opa]]. Bis zu dem Tag, an dem er im Graben lag."}], "orte": [{"id": "o1", "name": "Rhynern", "lat": 51.632, "lon": 7.857}, {"id": "o2", "name": "Hamm", "lat": 51.681, "lon": 7.816}, {"id": "o3", "name": "Soest", "lat": 51.571, "lon": 8.106}, {"id": "o4", "name": "Werne", "lat": 51.664, "lon": 7.633}, {"id": "o5", "name": "Münster", "lat": 51.962, "lon": 7.626}, {"id": "o6", "name": "Dortmund", "lat": 51.514, "lon": 7.468}, {"id": "o7", "name": "Uentrop", "lat": 51.667, "lon": 7.94}], "fakten": [{"id": "f1", "text": "Auf dem Hof in Rhynern lebten 1912 vier Generationen unter einem Dach (Beispiel)."}], "geloescht": [], "media": {"m1": {"src": "data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20120%22%3E%3Cdefs%3E%3CclipPath%20id%3D%22s%22%3E%3Cpath%20d%3D%22M8%206h84v50c0%2032-20%2050-42%2060C28%20106%208%2088%208%2056z%22/%3E%3C/clipPath%3E%3C/defs%3E%3Cpath%20d%3D%22M8%206h84v50c0%2032-20%2050-42%2060C28%20106%208%2088%208%2056z%22%20fill%3D%22%233B7A4E%22/%3E%3Cg%20clip-path%3D /* ---------- Index, Nummern, Beziehungen ----------
 Nummern (berechnet, nicht die ID):
  k        direkte Person mit Kekulé-Nummer k (2 Vater, 3 Mutter, 4–7 Großeltern …)
  k + a,b… Kinder des Elternpaars über k in Geburtsreihenfolge: 1a,1b = Geschwister, 2a = Onkel/Tante, 2aa = Cousin
  m_a      Kind nur von Person m (andere Beziehung): Halbverwandte, z. B. 4_a
  +, ++    Partner/in (erste, zweite Beziehung)                                                          */
let P=new Map(),G=new Map(),KIDS=new Map(),KEK=new Map(),NUM=new Map(),LONG=new Map(),REL=new Map(),SIBS=new Set();
const byBirth=(a,b)=>(yr(P.get(a).geb)||9999)-(yr(P.get(b).geb)||9999);
function kekFrom(root){const m=new Map();if(!root||!P.has(root))return m;const q=[[root,1]];while(q.length){const[id,k]=q.shift();if(m.has(id)||k>2**24)continue;m.set(id,k);const p=P.get(id);if(p.vater&&P.has(p.vater))q.push([p.vater,2*k]);if(p.mutter&&P.has(p.mutter))q.push([p.mutter,2*k+1])}return m}
function groupOf(id){const p=P.get(id);const s=new Set([...(KIDS.get(p.vater)||[]),...(KIDS.get(p.mutter)||[])]);s.add(id);return[...s].sort(byBirth)}
function fullGroup(id){const p=P.get(id);let s;
 if(P.has(p.vater)&&P.has(p.mutter)){const m=new Set(KIDS.get(p.mutter)||[]);s=(KIDS.get(p.vater)||[]).filter(x=>m.has(x))}
 else{const par=P.has(p.vater)?p.vater:P.has(p.mutter)?p.mutter:null;s=par?(KIDS.get(par)||[]).slice():[]}
 if(!s.includes(id))s.push(id);return s.sort(byBirth)}
function halves(id){const p=P.get(id);if(!(P.has(p.vater)&&P.has(p.mutter)))return[];const fg=new Set(fullGroup(id));
 return[p.vater,p.mutter].map(par=>[par,(KIDS.get(par)||[]).filter(x=>!fg.has(x))]).filter(([,a])=>a.length)}
const gen=k=>Math.floor(Math.log2(k))+1;
const sideOf=k=>((k>>(gen(k)-2))&1)?'mütterlicherseits':'väterlicherseits';
const word=(g,m,w,d)=>g==='w'?w:g==='m'?m:d;
function kekRel(k){if(k===1)return'Geschwister';const g=gen(k),m=k%2===0;if(g===2)return m?'Vater':'Mutter';
 const base=m?'großvater':'großmutter';const t=g===3?'G'+base.slice(1):g===4?'Ur'+base:g===5?'Urur'+base:`${g-3}× Ur${base}`;return `${t} ${sideOf(k)}`}
const LET=i=>i<26?String.fromCharCode(97+i):'z'+LET(i-25);
function index(){P=new Map(D.personen.map(p=>[p.id,p]));G=new Map(D.geschichten.map(g=>[g.id,g]));KIDS=new Map();D.fakten=D.fakten||[];
 for(const p of D.personen)for(const par of[p.vater,p.mutter])if(par&&P.has(par)){if(!KIDS.has(par))KIDS.set(par,[]);KIDS.get(par).push(p.id)}
 for(const v of KIDS.values())v.sort(byBirth);
 if(!P.has(D.meta.proband))D.meta.proband=D.personen[0]?D.personen[0].id:null;
 KEK=kekFrom(D.meta.proband);NUM=new Map();LONG=new Map();REL=new Map();SIBS=new Set();if(!D.meta.proband)return;
 const vn=id=>P.get(id).vorname||nm(P.get(id)),pr=D.meta.proband;
 const sps=(id,base)=>(P.get(id).partner||[]).forEach((s,i)=>{if(P.has(s)&&!NUM.has(s)&&!KEK.has(s)){NUM.set(s,base+'+'.repeat(i+1));REL.set(s,`Partner/in von ${vn(id)}`)}});
 const desc=(id,num,lab)=>{NUM.set(id,num);if(lab)REL.set(id,lab);sps(id,num);(KIDS.get(id)||[]).forEach((c,i)=>{if(!NUM.has(c)&&!KEK.has(c))desc(c,num+LET(i),`Kind von ${vn(id)}`)})};
 /* Halbverwandte: Kind der direkten Person m aus einer anderen Verbindung → m_a (z. B. 4_a) */
 const halfNums=(list,m)=>list.map((s,j)=>[s,`${KEK.get(m)}_${LET(j)}`]);
 const anc=[...KEK].filter(([,k])=>k>1).sort((a,b)=>a[1]-b[1]);
 for(const[id,k]of anc){NUM.set(id,String(k));REL.set(id,kekRel(k));sps(id,String(k))}
 fullGroup(pr).forEach((s,i)=>{SIBS.add(s);const n='1'+LET(i);if(s===pr){NUM.set(pr,n);REL.set(pr,'Geschwister');sps(pr,n);(KIDS.get(pr)||[]).forEach((c,j)=>{if(!NUM.has(c))desc(c,n+LET(j),`Kind von ${vn(pr)}`)})}else if(!NUM.has(s))desc(s,n,'Geschwister')});
 halves(pr).forEach(([par,a])=>halfNums(a,par).forEach(([s,n])=>{SIBS.add(s);if(!NUM.has(s))desc(s,n,'Halbgeschwister')}));
 for(const[id,k]of anc){const d=gen(k)-1,pre=d===1?'':d===2?'Groß':d===3?'Urgroß':`${d-2}× Urgroß`;
  const lab=(s,half)=>{const t=(half?'Halb':'')+pre+word(P.get(s).geschlecht,'onkel','tante','onkel/tante');return t[0].toUpperCase()+t.slice(1)+' '+sideOf(k)};
  const cousins=s=>{if(d===1)(KIDS.get(s)||[]).forEach(c=>{if((REL.get(c)||'').startsWith('Kind von'))REL.set(c,word(P.get(c).geschlecht,'Cousin','Cousine','Cousin/Cousine')+' '+sideOf(k))})};
  const fg=fullGroup(id);LONG.set(id,k+LET(fg.indexOf(id)));
  fg.forEach((s,i)=>{if(s===id||NUM.has(s)||KEK.has(s))return;desc(s,k+LET(i),lab(s,false));cousins(s)});
  halves(id).forEach(([par,a])=>halfNums(a,par).forEach(([s,n])=>{if(NUM.has(s)||KEK.has(s))return;desc(s,n,lab(s,true));cousins(s)}))}
 /* Stiefverwandte: Kinder eines nummerierten Partners (z. B. 4++) aus dessen anderer Verbindung → 4++_a */
 const stepLab=(x,c)=>{const base=String(NUM.get(x)).match(/^(\d+)\++$/);const g=P.get(c).geschlecht;
  if(base){const k=+base[1],gg=gen(k);if(gg===2)return'Stiefgeschwister';const d=gg-2,pre=d===1?'':d===2?'Groß':`${d-1}× Groß`;const t=pre+word(g,'onkel','tante','onkel/tante');return'Stief'+t+' '+sideOf(k)}
  return`Stiefkind von ${vn((P.get(x).partner||[]).find(y=>NUM.has(y)&&!/\+/.test(NUM.get(y)))||x)}`};
 for(let pass=0;pass<3;pass++)for(const[x,n]of[...NUM])if(/\+$/.test(n)){let j=0;(KIDS.get(x)||[]).forEach(c=>{if(NUM.has(c)||KEK.has(c))return;desc(c,`${n}_${LET(j++)}`,stepLab(x,c))})}}
/* Sortierschlüssel: Gruppe (Kekulé-Zahl), dann Halb-/Stiefzweig, dann Zeichenfolge (+ vor _ vor Buchstaben) */
function numKey(id){const s=LONG.get(id)||NUM.get(id);if(!s)return null;const m=s.match(/^(\d+)(.*)$/);if(!m)return null;let k=+m[1],rest=m[2],h=0;
 if(/^\++$/.test(rest)){const d=[...KEK].find(([,x])=>x===k);if(d&&LONG.has(d[0]))rest=LONG.get(d[0]).replace(/^\d+/,'')+rest}
 const mm=rest.match(/^(\+*)_(.*)$/);if(mm){h=(k%2?20:10)+mm[1].length;k=Math.floor(k/2);rest=mm[2]}
 return[k,h,rest]}
const chr=c=>c==='+'?1:c==='_'?2:10+c.charCodeAt(0);
const numSort=(a,b)=>{const A=numKey(a),B=numKey(b);if(!A&&!B)return 0;if(!A)return 1;if(!B)return-1;if(A[0]!==B[0])return A[0]-B[0];if(A[1]!==B[1])return A[1]-B[1];
 const x=A[2],y=B[2];for(let i=0;i<Math.max(x.length,y.length);i++){if(i>=x.length)return-1;if(i>=y.length)return 1;const d=chr(x[i])-chr(y[i]);if(d)return d}return 0};

const CW=156,CH=60,GY=70,RH=CH+GY,SGX=78,PXY=7;
let FOCUS={mode:'all'},LAYOUT=null,PENDING=null;
function layoutFamily(root,o){const placed=new Map(),phs=[];const kk=o.kek,W=o.w,GX=o.gap;
 const blk=()=>({nodes:[],c:new Map()});
 const add=(b,n)=>{b.nodes.push(n);const r=b.c.get(n.row);b.c.set(n.row,r?[Math.min(r[0],n.x),Math.max(r[1],n.x+W)]:[n.x,n.x+W])};
 const shift=(b,dx)=>{if(!dx)return b;b.nodes.forEach(n=>n.x+=dx);for(const[r,v]of b.c)b.c.set(r,[v[0]+dx,v[1]+dx]);return b};
 const merge=(a,b)=>{b.nodes.forEach(n=>a.nodes.push(n));for(const[r,v]of b.c){const q=a.c.get(r);a.c.set(r,q?[Math.min(q[0],v[0]),Math.max(q[1],v[1])]:[...v])}return a};

 const packR=(a,b,gap)=>{if(!a.nodes.length)return merge(a,b);const d=lo(a,b,gap);shift(b,d===-Infinity?0:d);return merge(a,b)};
 const mk=(id,row,cls)=>{const n={id,row,x:0,cls};if(id)placed.set(id,n);return n};
 const spousesOf=id=>o.spouses?(P.get(id).partner||[]).filter(s=>vis(s)&&!placed.has(s)&&!kk.has(s)):[];
 function desc(c,row){const B=blk(),n=mk(c,row,kk.has(c)?'':'coll');add(B,n);let x=W+GX;
  spousesOf(c).forEach(s=>{const sn=mk(s,row,'sp');sn.x=x;x+=W+GX;add(B,sn)});

  if(kids.length){const K=blk();kids.forEach(k=>{if(!placed.has(k))packR(K,desc(k,row+1),GX)});const r=K.c.get(row+1);
   if(r){const sp=B.nodes[1];const cx=(sp?(n.x+sp.x)/2:n.x)+W/2;shift(K,cx-(r[0]+r[1])/2);merge(B,K)}}

  for(const q of sn){const sk=(KIDS.get(q.id)||[]).filter(k=>vis(k)&&!placed.has(k)&&!(KIDS.get(id)||[]).includes(k));if(!sk.length)continue;
   const K=blk();sk.forEach(k=>packR(K,desc(k,row+1),GX));const r=K.c.get(row+1);shift(K,q.x+W/2-(r[0]+r[1])/2);
   for(const[rr,v]of K.c){const qq=B.c.get(rr);if(qq&&v[0]<qq[1]+GX&&v[1]>qq[0]-GX)shift(K,side==='left'?qq[0]-GX-v[1]:qq[1]+GX-v[0])}merge(B,K)}
  B.anchor=n;return B}
 function group(id,side,row){let mem=o.coll?groupOf(id).filter(x=>vis(x)):[id];

  if(n.id){const p=P.get(n.id);(KIDS.get(n.id)||[]).forEach(k=>{const m=byId.get(k);if(m&&Y.has(m))c.push(Y.get(m)-30)});

 rows.forEach((r,i)=>{const yy=lifeTop+i*RHT,x=X(r.b),w=Math.max(6,(r.d-r.b)*PX),lab=`${nm(r.p)}  ${life(r.p)}`,inside=w>lab.length*7.2+14;

 const btn=$('[data-rec]',host),t=$('.rect',host),h=$('.rech',host);
 btn.addEventListener('click',async e=>{e.preventDefault();e.stopPropagation();
  if(REC&&REC.mr&&REC.mr.state==='recording'){REC.mr.stop();return}
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('Aufnehmen wird hier nicht unterstützt – Audiodatei hochladen');return}
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(err){toast('Kein Zugriff aufs Mikrofon');return}
  const mime=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m));
  const mr=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:48000}:{});const chunks=[];REC={mr,stream,cancel:false};
  mr.ondataavailable=ev=>{if(ev.data.size)chunks.push(ev.data)};
  mr.onstop=()=>{stream.getTracks().forEach(x=>x.stop());const r=REC;if(r)clearInterval(r.tim);btn.classList.remove('on');btn.innerHTML=ic('mic');
   if(r&&r.cancel){REC=null;return}REC=null;const type=(mr.mimeType||'audio/webm').split(';')[0];onDone(new Blob(chunks,{type}),type);h.textContent='Aufnahme gespeichert – tippen für eine weitere'};
  mr.start(1000);const t0=Date.now();REC.tim=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);t.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`},500);
  btn.classList.add('on');btn.innerHTML=ic('stop');h.textContent='Läuft … zum Beenden tippen'})}

 const s=sheet(`<div class="shead"><h3>${o?'Eintrag bearbeiten':'Wusstest du?'}</h3><button class="ib" data-act="close" aria-label="Schließen">${ic('close')}</button></div>
 <form class="form" id="ff"><label>Text<textarea name="text" rows="4" placeholder="z. B. Opa Heinrich hat nie einen Führerschein gemacht.">${esc(o?o.text:'')}</textarea></label>${linkSel('text')}
 <div class="btns">${o?`<button type="button" class="btn ghost" data-f="del" style="color:var(--bad);margin-right:auto">Löschen</button>`:''}<button type="button" class="btn ghost" data-act="close">Abbrechen</button><button class="btn pri" type="submit">Speichern</button></div></form>`);
 bindLinkSel(s);setTimeout(()=>$('textarea',s).focus(),60);
 s.addEventListener('click',async e=>{if(e.target.closest('[data-f="del"]')){D.fakten=D.fakten.filter(f=>f!==o);if(o._mod!=='neu')D.geloescht.push(o.id);await commit();toast('Gelöscht')}});
 $('#ff',s).addEventListener('submit',async e=>{e.preventDefault();const t=(new FormData(e.target).get('text')||'').trim();if(!t)return toast('Bitte einen Text eintragen');
  if(o){o.text=t;markMod(o)}else{D.fakten.push({id:nextId('f',D.fakten.map(f=>f.id)),text:t,_mod:'neu'});factI=D.fakten.length*2-2}await commit();toast('Gespeichert')})}

/* ---------- Zeit-Tab: Zeitleiste | Jahrestage | Karte ---------- */
const zTabs=()=>`<div class="seg ztabs">${[['zeit','time','Zeitleiste'],['tage','cal','Jahrestage'],['karte','pin','Karte']].map(([k,i,l])=>`<button class="${S.zview===k?'on':''}" data-act="zview" data-v="${k}">${ic(i,'s')}${l}</button>`).join('')}</div>`;
VIEWS.zeit=()=>({zeit:zeitleiste,tage:jahrestage,karte:karte}[S.zview]||zeitleiste)();
ACT.zview=({v})=>{S.zview=v;saveS();VIEWS.zeit();window.scrollTo(0,0)};

/* Jahrestage: nächste Geburts- und Todestage ab heute */
const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function anniversaries(){const t=new Date(),t0=new Date(t.getFullYear(),t.getMonth(),t.getDate()),out=[];
 for(const p of D.personen){if(!vis(p.id))continue;for(const f of['geb','tod']){const m=String(p[f]||'').match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/);if(!m)continue;
  const d=+m[1],mo=+m[2],y=+m[3];let nx=new Date(t0.getFullYear(),mo-1,d);if(nx<t0)nx=new Date(t0.getFullYear()+1,mo-1,d);
  out.push({p,f,d,mo,y,nx,n:nx.getFullYear()-y,days:Math.round((nx-t0)/864e5)})}}
 return out.sort((a,b)=>a.days-b.days||a.y-b.y)}
const annText=a=>a.f==='geb'?(a.p.lebend?`wird ${a.n}`:`${a.n}. Geburtstag`):`${a.n}. Todestag`;
const round=n=>n%25===0||(n>=50&&n%10===0);
function jahrestage(){hdr('Jahrestage',infoBtn);const list=anniversaries();
 const today=list.filter(a=>a.days===0),rest=list.filter(a=>a.days>0);let cur=-1,h='';
 const row=a=>`<li><button class="prow" data-go="#person/${a.p.id}">${avatar(a.p,46)}<div class="pm"><b>${esc(nm(a.p))}</b><small>${a.d}. ${MON[a.mo-1]} · ${a.f==='geb'?'geboren':'gestorben'} ${a.y}</small></div><div class="pt"><span class="pill ${round(a.n)?'draft':''}">${a.f==='geb'?ic('cal','s'):ic('draft','s')}${annText(a)}</span></div></button></li>`;
 for(const a of rest){const k=a.nx.getFullYear()*12+a.mo;if(k!==cur){cur=k;h+=`</ul><h3 class="sec">${MON[a.mo-1]} ${a.nx.getFullYear()}</h3><ul class="plist">`}h+=row(a)}
 const missing=D.personen.filter(p=>vis(p.id)&&(p.geb||p.tod)&&!/^\d{1,2}\.\d{1,2}\.\d{4}/.test(p.geb||'')&&!/^\d{1,2}\.\d{1,2}\.\d{4}/.test(p.tod||'')).length;
 $('#main').innerHTML=`<div class="ztop">${zTabs()}</div>
 ${today.length?`<div class="today"><h3>${ic('cal','s')} Heute</h3><ul class="plist">${today.map(row).join('')}</ul></div>`:''}
 ${rest.length?`<ul class="plist">${h}</ul>`:`<p class="empty">Noch keine vollständigen Daten (Tag.Monat.Jahr) eingetragen.</p>`}
 ${missing?`<p class="muted" style="font-size:.9rem">${missing} Personen haben nur ein Jahr – sie erscheinen hier, sobald Tag und Monat bekannt sind.</p>`:''}
 <div class="stack" style="margin-top:16px"><button class="btn wide" data-act="ics" data-k="leb"><span class="bt2">${ic('dl','s')} Geburtstage in den Kalender<small>nur lebende Personen, jährlich wiederkehrend (.ics)</small></span></button><button class="btn wide ghost" data-act="ics" data-k="alle">Alle Jahrestage in den Kalender</button></div>`};
ACT.ics=({k})=>{const list=anniversaries().filter(a=>k==='alle'||(a.f==='geb'&&a.p.lebend&&!a.p.privat));if(!list.length)return toast('Keine passenden Daten');
 const z=n=>String(n).padStart(2,'0'),now=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
 const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Familien-Stammbaum//DE','CALSCALE:GREGORIAN'];
 for(const a of list)L.push('BEGIN:VEVENT',`UID:${a.p.id}-${a.f}@familien-stammbaum`,`DTSTAMP:${now}`,`DTSTART;VALUE=DATE:${CY}${z(a.mo)}${z(a.d)}`,'RRULE:FREQ=YEARLY',`SUMMARY:${a.f==='geb'?'Geburtstag':'Todestag'} ${nm(a.p)} (${a.y})`,'TRANSP:TRANSPARENT','END:VEVENT');
 L.push('END:VCALENDAR');const blob=new Blob([L.join('\r\n')],{type:'text/calendar'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${slug(D.meta.titel)}-jahrestage.ics`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000);toast('Datei öffnen, um sie in den Kalender zu übernehmen')};

/* ---------- Orte & Karte ---------- */
const KM=600,projLL=(lat,lon)=>[(lon-10.4)*Math.cos(51.2*Math.PI/180)*KM,-(lat-51.2)*KM];
const normOrt=s=>String(s||'').trim().replace(/^(in|bei|nahe)\s+/i,'').toLowerCase();
const ortOf=name=>(D.orte||[]).find(o=>normOrt(o.name)===normOrt(name));
function placeIndex(){const m=new Map(),get=n=>{const k=normOrt(n);if(!m.has(k))m.set(k,{name:n.trim().replace(/^(in|bei|nahe)\s+/i,''),items:[],stories:[]});return m.get(k)};
 for(const p of D.personen){if(!vis(p.id))continue;for(const[f,w]of[['gebOrt','geboren'],['todOrt','gestorben']]){const n=(p[f]||'').trim();if(n)get(n).items.push({p,w})}}
 for(const g of D.geschichten){if(!visG(g))continue;for(const n of g.orte||[])if(n.trim())get(n).stories.push(g)}
 for(const o of D.orte||[])get(o.name);return m}
/* Karte: Weltumriss (Natural Earth), Deutschland mit Bundesländern; Standardansicht NRW */
const NRW=[[50.32,5.87],[52.53,9.46]];
function karte(){hdr('Karte',infoBtn);const idx=placeIndex(),on=[],off=[];
 for(const[k,e]of idx){const n=e.items.length+e.stories.length;if(!n)continue;const o=ortOf(e.name);if(o&&o.lat!=null){const[x,y]=projLL(o.lat,o.lon);on.push({e,x,y,n})}else off.push(e)}
 $('#main').innerHTML=stageHTML(`${zTabs()}<button class="fab" data-act="orte">${ic('pin','s')}Orte${off.length?` (${off.length} ohne Position)`:''}</button>`).replace('<div class="stage">','<div class="stage map">');
 $('#fbar').innerHTML=`<span class="lg p"></span>Personen <span class="lg s"></span>Geschichten`;
 const g=$('#cg'),svg=$('#cv');
 g.innerHTML=`<clipPath id="declip"><path d="${MAPD.d}"/></clipPath><g transform="scale(${KM/100})"><path class="world" d="${MAPD.w}"/><path class="deland" d="${MAPD.d}"/><path class="st" d="${MAPD.i}" clip-path="url(#declip)"/><path class="deo" d="${MAPD.d}"/></g>`+
  on.sort((a,b)=>b.n-a.n).map(({e,x,y,n})=>{const t=e.items.length&&e.stories.length?'b':e.stories.length?'s':'p',r=(6+Math.sqrt(n)*3).toFixed(1);
   return`<g class="mk ${t}" data-ort="${esc(e.name)}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})"><g class="mki"><circle r="${r}"/><text x="${(+r+4).toFixed(1)}" y="5">${esc(e.name)}${n>1?` (${n})`:''}</text></g></g>`}).join('');
 PZ=panzoom(svg,g,tapNode,'karte',{max:14,onApply:st=>g.style.setProperty('--inv',(1/st.s).toFixed(4))});PZ.bounds();
 if(!PZ.restore()){const[a1,b1]=projLL(NRW[0][0],NRW[0][1]),[a2,b2]=projLL(NRW[1][0],NRW[1][1]),w=svg.clientWidth,h=svg.clientHeight;
  const sc=Math.min((w-60)/Math.abs(a2-a1),(h-150)/Math.abs(b2-b1));PZ.place((a1+a2)/2,(b1+b2)/2,sc,w/2,h/2+30)}}
function ortSheet(name){const e=placeIndex().get(normOrt(name))||{name,items:[],stories:[]},o=ortOf(name);
 const s=sheet(`<div class="shead"><h3>${ic('pin','s')} ${esc(e.name)}</h3><button class="ib" data-act="close" aria-label="Schließen">${ic('close')}</button></div>
 ${e.items.length?`<div class="links" style="margin:8px 0 10px">${e.items.map(it=>`<button class="plk" data-go="#person/${it.p.id}">${avatar(it.p,32)}<span>${esc(nm(it.p))} <small>${it.w}</small></span></button>`).join('')}</div>`:''}
 ${e.stories.length?`<div class="links" style="margin:0 0 14px">${e.stories.map(g=>`<button class="plk add sto" data-go="#geschichte/${g.id}">${ic((TYP[g.typ]||TYP.archiv)[0],'s')}<span>${esc(g.titel)}${g.jahr?` <small>${esc(g.jahr)}</small>`:''}</span></button>`).join('')}</div>`:''}
 <div class="form"><label>Position (Breite, Länge)<input id="ll" value="${o&&o.lat!=null?`${o.lat}, ${o.lon}`:''}" placeholder="51.632, 7.857" inputmode="decimal"></label>
 <small>Tipp: In Google Maps den Ort lange antippen und die Zahlen kopieren. Einmal festgelegt, gilt die Position für alle Personen mit diesem Ort.</small>
 <div id="osm"></div>
 <div class="btns"><button class="btn ghost" data-f="osm">${ic('search','s')} Online suchen</button><button class="btn pri" data-f="save">Speichern</button></div></div>`);
 const save=async(lat,lon)=>{let r=ortOf(e.name);if(!r){r={id:nextId('o',(D.orte||[]).map(x=>x.id)),name:e.name,_mod:'neu'};D.orte.push(r)}else markMod(r);r.lat=+(+lat).toFixed(5);r.lon=+(+lon).toFixed(5);await saveD();closeSheet();toast('Position gespeichert');if(CUR.r==='zeit')VIEWS.zeit()};
 s.addEventListener('click',async ev=>{const f=ev.target.closest('[data-f]')?.dataset.f;
  if(f==='save'){const m=$('#ll',s).value.match(/(-?\d+(?:[.,]\d+)?)\s*[,; ]\s*(-?\d+(?:[.,]\d+)?)/);if(!m)return toast('Bitte zwei Zahlen eingeben, z. B. 51.63, 7.86');save(m[1].replace(',','.'),m[2].replace(',','.'))}
  if(f==='osm'){$('#osm',s).innerHTML='<small>Suche bei OpenStreetMap … (übertragen wird nur der Ortsname)</small>';
   try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language=de&q=${encodeURIComponent(e.name)}`);const a=await r.json();
    $('#osm',s).innerHTML=a.length?`<div class="tsr">${a.map(x=>`<button data-f="pick" data-lat="${x.lat}" data-lon="${x.lon}">${ic('pin','s')}<span>${esc(x.display_name)}</span></button>`).join('')}</div>`:'<small>Nichts gefunden – Ortsnamen genauer schreiben oder Zahlen eintragen.</small>'}catch(err){$('#osm',s).innerHTML='<small>Keine Verbindung.</small>'}}
  if(f==='pick'){const b=ev.target.closest('[data-f]');save(b.dataset.lat,b.dataset.lon)}})}
ACT.orte=()=>{const idx=[...placeIndex().values()].sort((a,b)=>(!!ortOf(a.name)&&ortOf(a.name).lat!=null)-(!!ortOf(b.name)&&ortOf(b.name).lat!=null)||(b.items.length+b.stories.length)-(a.items.length+a.stories.length));
 sheet(`<div class="shead"><h3>Orte</h3><button class="ib" data-act="close" aria-label="Schließen">${ic('close')}</button></div><p class="muted" style="margin:4px 0 8px">Aus Geburts- und Sterbeorten und den Orten der Geschichten. Gleich geschriebene Orte werden zusammengefasst.</p>
 <div class="tsr">${idx.map(e=>{const o=ortOf(e.name),ok=o&&o.lat!=null;return`<button data-act="ort" data-n="${esc(e.name)}">${ic('pin','s'+(ok?' mod':''))}<span><b>${esc(e.name)}</b><br><small>${e.items.length} Personen, ${e.stories.length} Geschichten · ${ok?'Position gesetzt':'ohne Position'}</small></span></button>`}).join('')||'<small>Noch keine Orte eingetragen.</small>'}</div>`)};
ACT.ort=({n})=>ortSheet(n);

/* ---------- Frage Zeitzeugen ---------- */
const DATUM=/\d{1,2}\.\d{1,2}\.\d{4}/;
function gapsOf(p){const u=new Set(p.unbekannt||[]),n=p.vorname||nm(p),out=[],add=(f,q)=>{if(!u.has(f))out.push([f,q])};
 if(!p.geb)add('geb',`Wann wurde ${n} geboren?`);else if(!DATUM.test(p.geb))add('gebtag',`An welchem Tag wurde ${n} geboren (bisher: ${p.geb})?`);
 if(!p.gebOrt)add('gebOrt',`Wo wurde ${n} geboren?`);
 if(!p.lebend){const by=yr(p.geb);if(!p.tod&&by&&by>CY-100)add('tod',`Lebt ${n} noch? Falls nicht: wann und wo gestorben?`);else{if(!p.tod)add('tod',`Wann ist ${n} gestorben?`);else if(!DATUM.test(p.tod))add('todtag',`An welchem Tag ist ${n} gestorben (bisher: ${p.tod})?`);if(!p.todOrt)add('todOrt',`Wo ist ${n} gestorben?`)}}
 if(KEK.has(p.id)||SIBS.has(p.id)){if(!p.vater)add('vater',`Wer war der Vater von ${n}?`);if(!p.mutter)add('mutter',`Wer war die Mutter von ${n}?`)}
 if(!p.beruf&&!p.lebend)add('beruf',`Was war ${n} von Beruf?`);
 if(p.geschlecht==='w'&&(p.partner||[]).length&&!p.geburtsname)add('geburtsname',`Wie hieß ${n} vor der Ehe?`);
 const m=(p.notiz||'').match(/^(?:[•\-]\s*)?Offene Fragen:\s*(.+)$/m);if(m)m[1].split(/;\s*/).filter(Boolean).forEach((q,i)=>add('q'+i,q));
 if(!(p.fotos||[]).length&&!p.lebend&&(KEK.get(p.id)||99)<=15)add('foto',`Gibt es ein Foto von ${n}?`);
 return out}
function qSection(p){if(SIBS.has(p.id))return 0;const k=numKey(p.id);if(!k)return 3;if(k[0]===1)return 0;return sideOf(k[0])==='väterlicherseits'?1:2}
function qGen(p){const k=KEK.get(p.id);if(k)return gen(k);const key=numKey(p.id);if(!key)return 99;return gen(key[0])-Math.max(0,(key[2].match(/[a-z]/g)||[]).length-1)}
let qFilter=-1;const QSEL=new Set();
VIEWS.fragen=()=>{hdr('Frage Zeitzeugen');const names=['Geschwister','Väterlicherseits','Mütterlicherseits','Weitere'];
 const ps=D.personen.filter(p=>vis(p.id)&&!p.privat).map(p=>({p,q:gapsOf(p),s:qSection(p),g:qGen(p)})).filter(x=>x.q.length&&(qFilter<0||x.s===qFilter));
 ps.sort((a,b)=>a.s-b.s||a.g-b.g||numSort(a.p.id,b.p.id));const total=ps.reduce((a,x)=>a+x.q.length,0);let h='',cur=-1,cg=-1;
 for(const x of ps){if(x.s!==cur){cur=x.s;cg=-1;h+=`<h3 class="sec">${names[x.s]}</h3>`}
  if(x.g!==cg&&x.s!==3){cg=x.g;h+=`<div class="genh">${x.g===1?'Unsere Generation':x.g===2?'Eltern':x.g===3?'Großeltern':x.g===4?'Urgroßeltern':`${x.g}. Generation`}</div>`}
  h+=`<div class="qcard"><div class="qhead">${avatar(x.p,40)}<div class="pm"><b>${esc(nm(x.p))}</b><small>${esc([life(x.p),relLabel(x.p.id)].filter(Boolean).join(', '))}</small></div><button class="btn sm ghost" data-act="editPerson" data-id="${x.p.id}">${ic('edit','s')} Antwort</button></div>
  ${x.q.map(([f,q])=>{const id=x.p.id+'|'+f;return`<div class="qrow"><label><input type="checkbox" data-q="${esc(id)}" ${QSEL.has(id)?'checked':''}> <span>${esc(q)}</span></label><button class="ib" data-act="qUnknown" data-id="${x.p.id}" data-f="${f}" aria-label="Nicht herauszufinden" title="Nicht herauszufinden">${ic('close','s')}</button></div>`}).join('')}</div>`}
 $('#main').innerHTML=`<p class="muted" style="margin-top:0">${total} offene Fragen. Antippen zum Auswählen, dann als Nachricht teilen oder beim Besuch vorlesen. ✕ = lässt sich nicht herausfinden (ausblenden).</p>
 <div class="chips">${[[-1,'Alle'],[0,'Geschwister'],[1,'Väterlicherseits'],[2,'Mütterlicherseits']].map(([k,l])=>`<button class="chip ${qFilter===k?'on':''}" data-act="qfilter" data-k="${k}">${l}</button>`).join('')}</div>
 ${h||'<p class="empty">Keine offenen Fragen – alles bekannt.</p>'}
 <div class="qbar"><button class="btn pri" data-act="qShare">${ic('share','s')} <span id="qn">${QSEL.size}</span> Fragen teilen</button><button class="btn" data-act="recordFor">${ic('mic','s')} Aufnehmen</button></div>`;
 $('#main').addEventListener('change',e=>{const q=e.target.dataset.q;if(!q)return;e.target.checked?QSEL.add(q):QSEL.delete(q);$('#qn').textContent=QSEL.size})};
ACT.qfilter=({k})=>{qFilter=+k;VIEWS.fragen()};
ACT.qUnknown=async({id,f})=>{const p=P.get(id);p.unbekannt=[...new Set([...(p.unbekannt||[]),f])];markMod(p);QSEL.delete(id+'|'+f);await saveD();index();VIEWS.fragen();toast('Ausgeblendet')};
ACT.qShare=async()=>{if(!QSEL.size)return toast('Erst Fragen auswählen');const by=new Map();
 for(const k of QSEL){const[id,f]=k.split('|');const p=P.get(id);if(!p)continue;const q=(gapsOf(p).find(x=>x[0]===f)||[])[1];if(!q)continue;if(!by.has(id))by.set(id,[]);by.get(id).push(q)}
 const txt='Fragen für unsere Familienchronik\n'+[...by].map(([id,qs])=>`\n${nm(P.get(id))}${relLabel(id)?` (${relLabel(id)})`:''}\n${qs.map(q=>'• '+q).join('\n')}`).join('\n');
 if(navigator.share){try{await navigator.share({text:txt});return}catch(e){if(e.name==='AbortError')return}}
 try{await navigator.clipboard.writeText(txt);toast('Fragen kopiert')}catch(e){sheet(`<textarea class="cx" readonly>${esc(txt)}</textarea>`)}};

/* ---------- Ausklappen, Generationen ---------- */
ACT.treeGen=({d})=>{const max=Math.max(2,...[...KEK.values()].map(gen));let v=(S.treeGen||max)+ +d;S.treeGen=v>=max?0:Math.max(2,v);saveS();liveTree()};
ACT.unfoldAll=()=>{S.collapsed=[];saveS();liveTree()};
ACT.fold=({id})=>{const c=new Set(S.collapsed);c.has(id)?c.delete(id):c.add(id);S.collapsed=[...c];saveS();closeSheet();VIEWS.baum()};

ACT.gsort=()=>{S.gsort=S.gsort==='jahr'?'neu':'jahr';saveS();VIEWS.geschichten()};

/* ---------- Info & Daten ---------- */
const modCount=()=>D.personen.filter(p=>p._mod).length+D.geschichten.filter(g=>g._mod).length+D.fakten.filter(f=>f._mod).length+D.orte.filter(o=>o._mod).length+D.geloescht.length;
let RSTAT=null;const REMOTE='familie.json';
const fmtStand=s=>s?new Date(s).toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'}):'';
VIEWS.info=()=>{hdr('Info & Daten');const m=D.meta,mc=modCount();
 const seg=(k,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button class="${S[k]===v?'on':''}" data-act="set" data-k="${k}" data-v="${v}">${l}</button>`).join('')}</div>`;
 const online=location.protocol.startsWith('http');
 const stat=!online?'Diese Kopie läuft ohne Internetadresse – Familiendaten kommen nur per Datei.':RSTAT==='keine'?'Noch keine Online-Familiendatei vorhanden.':m.stand?`Stand der Familiendaten: ${fmtStand(m.stand)}`:m.demo?'Beispieldaten – noch keine Familiendaten geladen.':'Nur auf diesem Gerät angelegt.';
 $('#main').innerHTML=`<section class="card"><h3>So geht’s</h3><ul class="use">
 <li>Person antippen öffnet die Kurzinfo, von dort das Profil.</li><li>Baum und Zeitleiste: mit einem Finger schieben, mit zwei zoomen (iPad mit Tastatur: + und −).</li>
 <li>„Ansicht“ im Baum: Person suchen, Fächer, nur Vorfahren, Ehepartner.</li><li>Gestrichelte Felder antippen, um fehlende Eltern einzutragen.</li>
 <li>${ic('edit','s mod')} eigene Änderung, ${ic('lock','s')} privat, ${ic('draft','s')} Entwurf, ${ic('eyeoff','s')} ausgeblendet.</li>

 <details class="card"><summary>Wie sicher ist das?</summary><div><ul class="use">
 <li>Die App selbst (Programmcode) ist öffentlich, enthält aber keine Familiendaten.</li>
 <li>Die Familiendatei liegt zwar öffentlich herunterladbar auf GitHub, ist aber mit AES-256 verschlüsselt. Ohne Passwort ist sie unlesbar – auch für GitHub.</li>
 <li>Die Sicherheit hängt am Passwort: kein „12345678“, sondern 4–5 zufällige Wörter, z. B. <em>Tanne Kompass Rübe Laterne</em>.</li>
 <li>Auf jedem Gerät liegen die Daten nach dem Öffnen unverschlüsselt im App-Speicher. Wer das entsperrte Gerät hat, sieht sie.</li>
 <li>Private Einträge (${ic('lock','s')}) verlassen das eigene Gerät nie – außer in der Sicherung.</li>
 <li>Wird das Passwort weitergegeben: neues Passwort wählen und neu hochladen. Alte Versionen bleiben in der GitHub-Historie mit dem alten Passwort lesbar.</li></ul>

/* ---------- Verschlüsselung, Dateien ---------- */
const b64=buf=>{const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i+=32768)s+=String.fromCharCode.apply(null,b.subarray(i,i+32768));return btoa(s)};
const unb64=s=>{const t=atob(s),u=new Uint8Array(t.length);for(let i=0;i<t.length;i++)u[i]=t.charCodeAt(i);return u};
async function keyFrom(pw,salt,iter){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encrypt(obj,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),iter=600000,key=await keyFrom(pw,salt,iter);
 const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));return{format:'stammbaum-verschluesselt',v:1,iter,salt:b64(salt),iv:b64(iv),data:b64(ct)}}
async function decrypt(o,pw){const key=await keyFrom(pw,unb64(o.salt),o.iter);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.data));return JSON.parse(new TextDecoder().decode(pt))}
const slug=s=>String(s||'familie').toLowerCase().replace(/[äöüß]/g,c=>({ä:'ae',ö:'oe',ü:'ue',ß:'ss'}[c])).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

const strip=r=>{const c={...r};delete c._mod;return c};
async function mediaOut(ids){const out={};for(const k of ids){const v=MEDIA.get(k);if(!v)continue;out[k]=v.blob?{src:await blobToURL(v.blob),mime:v.mime,name:v.name,caption:v.caption||''}:{src:v.src,caption:v.caption||'',...(v.mime?{mime:v.mime}:{})}}return out}

async function buildFile(family){const ps=D.personen.filter(p=>!(family&&p.privat)),ids=new Set(ps.map(p=>p.id));
 const clean=p=>({...(family?strip(p):p),vater:ids.has(p.vater)?p.vater:null,mutter:ids.has(p.mutter)?p.mutter:null,partner:(p.partner||[]).filter(x=>ids.has(x))});
 const gs=D.geschichten.filter(g=>!(family&&g.privat)).map(g=>({...(family?strip(g):g),personen:(g.personen||[]).filter(x=>ids.has(x))}));
 const meta={...D.meta};delete meta.demo;delete meta._mod;if(!ids.has(meta.proband))meta.proband=(ps[0]||{}).id;
 return{format:'stammbaum',v:4,erstellt:today(),meta,personen:ps.map(clean),geschichten:gs,fakten:D.fakten.map(f=>family?strip(f):f),orte:D.orte.map(o=>family?strip(o):o),geloescht:family?[]:D.geloescht,media:await mediaOut(usedMedia(ps,gs,meta))}}
async function saveFile(name,text,share){const blob=new Blob([text],{type:'application/json'});
 if(share&&navigator.canShare){const file=new File([blob],name,{type:'application/json'});if(navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return true}catch(e){if(e.name==='AbortError')return false}}}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000);return true}

function remap(oldId,newId,recs){const re=new RegExp('\\[\\['+oldId+'(?=[|\\]])','g');for(const r of recs){if(r.vater===oldId)r.vater=newId;if(r.mutter===oldId)r.mutter=newId;if(r.partner)r.partner=r.partner.map(x=>x===oldId?newId:x);if(r.personen)r.personen=r.personen.map(x=>x===oldId?newId:x);if(r.text)r.text=r.text.replace(re,'[['+newId);if(r.notiz)r.notiz=r.notiz.replace(re,'[['+newId)}}
function upsertAll(ps,gs,fs,dels,os=[]){/* fügt Datensätze ein; neue ids, die schon anders belegt sind, bekommen eine freie id */
 const all=[...ps,...gs,...fs];
 for(const[list,pre,src]of[[D.personen,'n',ps],[D.geschichten,'g',gs],[D.fakten,'f',fs],[D.orte,'o',os]])for(const r of src){const i=list.findIndex(x=>x.id===r.id);
  if(i>=0&&r._mod==='neu'&&JSON.stringify(strip(list[i]))!==JSON.stringify(strip(r))){const nid=nextId(pre,[...list.map(x=>x.id),...src.map(x=>x.id)]);const old=r.id;r.id=nid;remap(old,nid,all);list.push(r)}
  else if(i>=0)list[i]=r;else list.push(r)}
 const del=new Set(dels||[]);D.personen=D.personen.filter(p=>!del.has(p.id));D.geschichten=D.geschichten.filter(g=>!del.has(g.id));D.fakten=D.fakten.filter(f=>!del.has(f.id));D.orte=D.orte.filter(x=>!del.has(x.id));return del}
ACT.imp=async()=>{const[f]=await pickFiles('.json,application/json');if(!f)return;let o;try{o=JSON.parse(await f.text())}catch(e){return toast('Keine gültige Datei')}
 if(o.format==='stammbaum-verschluesselt'){const stored=await DB.get('kv','pw');let data=null;if(stored)try{data=await decrypt(o,stored)}catch(e){}
  if(!data){const r=await ask({title:'Passwort',fields:[{name:'pw',label:'Passwort der Familiendatei',type:'password'}],ok:'Öffnen'});if(!r)return;try{data=await decrypt(o,r.pw);await DB.put('kv','pw',r.pw)}catch(e){return toast('Passwort falsch oder Datei beschädigt')}}
  data.meta=data.meta||{};data.meta.stand=o.stand||data.meta.stand;o=data}
 if(o.format==='stammbaum-aenderungen')return mergeChanges(o);
 if(o.format!=='stammbaum'||!Array.isArray(o.personen))return toast('Unbekanntes Dateiformat');
 const mc=modCount();if(!await ask({title:'Datei laden?',text:`${o.personen.length} Personen und ${(o.geschichten||[]).length} Geschichten ersetzen die Daten auf diesem Gerät.${mc&&!D.meta.demo?` Deine ${mc} eigenen Änderungen bleiben erhalten.`:''}`,ok:'Laden'}))return;
 await applyFull(o);toast('Geladen');history.replaceState(null,'','#start');route()};
async function mergeChanges(o){if(!await ask({title:'Änderungen übernehmen?',text:`${(o.personen||[]).length} Personen, ${(o.geschichten||[]).length} Geschichten, ${(o.fakten||[]).length} Einträge, ${(o.geloescht||[]).length} gelöscht.`,ok:'Übernehmen'}))return;
 for(const[k,v]of Object.entries(o.media||{}))if(!MEDIA.has(k))await putMedia(k,v);else if(MEDIA.get(k).src!==v.src){const nk=nextId('m',MEDIA.keys());await putMedia(nk,v);for(const r of[...(o.personen||[]),...(o.geschichten||[])]){if(r.fotos)r.fotos=r.fotos.map(x=>x===k?nk:x);if(r.bilder)r.bilder=r.bilder.map(x=>x===k?nk:x);(r.anhang||[]).forEach(a=>{if(a.m===k)a.m=nk})}}
 for(const r of[...(o.personen||[]),...(o.geschichten||[]),...(o.fakten||[]),...(o.orte||[])])if(!r._mod)r._mod='geändert';
 const del=upsertAll(o.personen||[],o.geschichten||[],o.fakten||[],o.geloescht,o.orte||[]);D.geloescht=[...new Set([...D.geloescht,...del])];await saveD();index();toast('Übernommen');route()}
async function loadDataset(o){D={meta:{...o.meta},personen:o.personen||[],geschichten:o.geschichten||[],fakten:o.fakten||[],orte:o.orte||[],geloescht:o.geloescht||[]};
 MEDIA.clear();URLC.clear();try{await DB.clear('media')}catch(e){}for(const[k,v]of Object.entries(o.media||{}))await putMedia(k,v);

async function applyFull(o){const demo=D.meta.demo;const kp=demo?[]:D.personen.filter(p=>p._mod),kg=demo?[]:D.geschichten.filter(g=>g._mod),kf=demo?[]:D.fakten.filter(f=>f._mod),ko=demo?[]:D.orte.filter(x=>x._mod),kd=demo?[]:D.geloescht.slice();
 const km=new Map();for(const id of usedMedia(kp,kg,null))if(MEDIA.has(id))km.set(id,MEDIA.get(id));
 await loadDataset(o);
 const ps=[],gs=[],fs=[],os=[];for(const[src,list,out]of[[kp,D.personen,ps],[kg,D.geschichten,gs],[kf,D.fakten,fs],[ko,D.orte,os]])for(const r of src){const x=list.find(y=>y.id===r.id);if(!(x&&JSON.stringify(strip(x))===JSON.stringify(strip(r))))out.push(r)}
 for(const[k,v]of km)if(!MEDIA.has(k))await putMedia(k,v);
 const del=upsertAll(ps,gs,fs,kd.filter(id=>[...D.personen,...D.geschichten,...D.fakten,...D.orte].some(x=>x.id===id)),os);D.geloescht=[...del];await saveD();index()}

/* ---------- GEDCOM 5.5.1 ---------- */
function gedDate(s){if(!s)return'';const M=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];s=String(s).trim();
 const pre=/^(ca\.?|um|~)\s*/i.test(s)?'ABT ':/^vor\s/i.test(s)?'BEF ':/^nach\s/i.test(s)?'AFT ':'';
 let m=s.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);if(m)return pre+`${+m[1]} ${M[+m[2]-1]} ${m[3]}`;m=s.match(/(\d{1,2})\.(\d{4})/);if(m)return pre+`${M[+m[1]-1]} ${m[2]}`;const y=yr(s);return y?pre+y:''}
function gedText(lvl,tag,text){const out=[];String(text).split('\n').forEach((line,i)=>{const ch=line.match(/.{1,200}/g)||[''];ch.forEach((c,j)=>out.push(i===0&&j===0?`${lvl} ${tag} ${c}`.trimEnd():`${lvl+1} ${j===0?'CONT':'CONC'} ${c}`.trimEnd()))});return out}
function buildGedcom(withPriv){const ps=D.personen.filter(p=>withPriv||!p.privat),ids=new Set(ps.map(p=>p.id));const I=new Map(ps.map((p,i)=>[p.id,`@I${i+1}@`]));
 const fams=[];const findF=(a,b)=>fams.find(f=>(f.a===a&&f.b===b)||(f.a===b&&f.b===a));
 for(const p of ps){const v=ids.has(p.vater)?p.vater:null,m=ids.has(p.mutter)?p.mutter:null;if(!v&&!m)continue;let f=findF(v,m);if(!f){f={a:v,b:m,kids:[]};fams.push(f)}f.kids.push(p.id)}
 for(const p of ps)for(const q of p.partner||[])if(ids.has(q)&&!findF(p.id,q)){const w=p.geschlecht==='w';fams.push({a:w?q:p.id,b:w?p.id:q,kids:[]})}
 fams.forEach((f,i)=>f.ref=`@F${i+1}@`);
 const gs=D.geschichten.filter(g=>(withPriv||!g.privat));const N=new Map(gs.map((g,i)=>[g.id,`@N${i+1}@`]));
 const L=['0 HEAD','1 SOUR FAMILIEN_STAMMBAUM','2 NAME Familien-Stammbaum (Web-App)',`1 DATE ${gedDate(new Date().toLocaleDateString('de-DE'))}`,'1 GEDC','2 VERS 5.5.1','2 FORM LINEAGE-LINKED','1 CHAR UTF-8','1 LANG German'];
 for(const p of ps){L.push(`0 ${I.get(p.id)} INDI`,`1 NAME ${p.vorname||''} /${p.nachname||''}/`.replace(/\s+/g,' '));if(p.vorname)L.push(`2 GIVN ${p.vorname}`);if(p.nachname)L.push(`2 SURN ${p.nachname}`);
  if(p.geburtsname)L.push(`1 NAME ${p.vorname||''} /${p.geburtsname}/`,'2 TYPE birth');
  L.push(`1 SEX ${{m:'M',w:'F'}[p.geschlecht]||'U'}`);
  if(p.geb||p.gebOrt){L.push('1 BIRT');if(gedDate(p.geb))L.push(`2 DATE ${gedDate(p.geb)}`);if(p.gebOrt)L.push(`2 PLAC ${p.gebOrt}`)}
  if(p.tod||p.todOrt){L.push('1 DEAT');if(gedDate(p.tod))L.push(`2 DATE ${gedDate(p.tod)}`);if(p.todOrt)L.push(`2 PLAC ${p.todOrt}`)}else if(!p.lebend&&yr(p.geb)&&yr(p.geb)<CY-110)L.push('1 DEAT Y');
  if(p.beruf)p.beruf.split(/\s*;\s*/).filter(Boolean).forEach(b=>L.push(`1 OCCU ${b}`));
  const note=[plain(p.notiz),...(p.anekdoten||[]).map(a=>`Anekdote${a.von?` (erzählt von ${a.von})`:''}: ${a.text}`),p.quelle?`Quellen: ${p.quelle}`:''].filter(Boolean).join('\n');if(note)L.push(...gedText(1,'NOTE',note));
  if(NUM.has(p.id))L.push(`1 REFN ${NUM.get(p.id)}`);
  for(const f of fams){if(f.kids.includes(p.id))L.push(`1 FAMC ${f.ref}`);if(f.a===p.id||f.b===p.id)L.push(`1 FAMS ${f.ref}`)}
  for(const g of gs)if((g.personen||[]).includes(p.id))L.push(`1 NOTE ${N.get(g.id)}`)}
 for(const f of fams){L.push(`0 ${f.ref} FAM`);const A=P.get(f.a),B=P.get(f.b);
  const hw=[[f.a,A],[f.b,B]].filter(([id])=>id);hw.forEach(([id,x],i)=>L.push(`1 ${(x.geschlecht==='w'||(i===1&&x.geschlecht!=='m'))?'WIFE':'HUSB'} ${I.get(id)}`));
  f.kids.forEach(k=>L.push(`1 CHIL ${I.get(k)}`))}
 for(const g of gs)L.push(...gedText(0,`${N.get(g.id)} NOTE`,[g.titel,g.jahr,g.erzaehlt?`erzählt von ${g.erzaehlt}`:'',g.quelle?`Quelle: ${g.quelle}`:'','',plain(g.text).replace(/\s*\n\s*/g,'\n')].filter((x,i)=>x||i===4).join('\n')));
 L.push('0 TRLR');return L.join('\r\n')}
ACT.gedcom=async()=>{const r=await ask({title:'GEDCOM exportieren',text:'Standardformat für Genealogie-Programme. Fotos und Aufnahmen sind nicht enthalten, Geschichten als Notizen.',ok:'Ohne Privates'});if(!r)return;
 saveFile(`${slug(D.meta.titel)}-${today()}.ged`,buildGedcom(false),true)};

 const thead='<thead><tr><th>Nr.</th><th>Name</th><th>Geboren</th><th>Gestorben</th><th>Beruf</th></tr></thead>';
 h+=`<section class="pg title">${m.wappen&&MEDIA.has(m.wappen)?`<img src="${murl(m.wappen)}" alt="">`:''}<h1>${esc(m.titel||'Unsere Familie')}</h1>${m.untertitel?`<p>${esc(m.untertitel)}</p>`:''}<p class="st">Stand: ${new Date().toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</p></section>`;
 if(o.fan){const G=Math.min(S.fanGen,7),R=fanR(G)+6;h+=`<section class="pg"><h2>Vorfahren im Überblick</h2><svg viewBox="${-R} ${-R} ${2*R} ${R+8}" class="pfan">${fanSVG(D.meta.proband,G)}</svg></section>`}
 if(o.ahnen){const by=new Map();for(const[id,k]of KEK){const p=P.get(id);if(!ok(p))continue;const g=gen(k);if(!by.has(g))by.set(g,[]);by.get(g).push([k,p])}
  const sib=[...SIBS].map(id=>P.get(id)).filter(ok).sort((a,b)=>numSort(a.id,b.id));
  h+=`<section class="pg"><h2>Ahnenliste</h2>`;
  if(sib.length)h+=`<h3>Geschwister</h3><table>${thead}<tbody>${sib.map(row).join('')}</tbody></table>`;
  for(const[g,list]of[...by].sort((a,b)=>a[0]-b[0])){if(g===1)continue;h+=`<h3>${g===2?'Eltern':g===3?'Großeltern':g===4?'Urgroßeltern':`${g-1}. Generation`}</h3><table>${thead}<tbody>${list.sort((a,b)=>a[0]-b[0]).map(([,p])=>row(p)).join('')}</tbody></table>`}
  h+='</section>'}
 if(o.verw){const rest=D.personen.filter(p=>ok(p)&&NUM.has(p.id)&&!KEK.has(p.id)&&!SIBS.has(p.id)).sort((a,b)=>numSort(a.id,b.id));
  if(rest.length)h+=`<section class="pg"><h2>Weitere Verwandte</h2><table><thead><tr><th>Nr.</th><th>Name</th><th>Beziehung</th><th>Lebensdaten</th></tr></thead><tbody>${rest.map(p=>`<tr><td>${esc(NUM.get(p.id))}</td><td><b>${esc(nm(p))}</b></td><td>${esc(relLabel(p.id))}</td><td>${esc(life(p))}</td></tr>`).join('')}</tbody></table></section>`}
 if(o.port){const ps=D.personen.filter(p=>ok(p)&&((p.anekdoten||[]).length||p.notiz||(p.fotos||[]).length)).sort((a,b)=>numSort(a.id,b.id));
  if(ps.length)h+=`<section class="pg"><h2>Porträts</h2>${ps.map(p=>{const f=(p.fotos||[]).find(x=>MEDIA.has(x)&&mkind(x)==='bild');return`<article class="por">${f?`<img src="${murl(f)}" alt="">`:''}<div><h3>${esc(nm(p))} <small>${esc(life(p))}</small></h3><p class="rel">${esc(relLabel(p.id))}</p>${md(p.notiz)}${(p.anekdoten||[]).map(a=>`<blockquote>„${esc(a.text)}“${a.von?` <small>– ${esc(a.von)}</small>`:''}</blockquote>`).join('')}</div></article>`}).join('')}</section>`}
 if(o.gesch){const gs=D.geschichten.filter(g=>visG(g)&&!g.entwurf&&(o.priv||!g.privat)).sort((a,b)=>(a.typ==='thema'?0:1)-(b.typ==='thema'?0:1)||(yr(a.jahr)||9999)-(yr(b.jahr)||9999));
  if(gs.length)h+=`<section class="pg"><h2>Geschichten</h2>${gs.map(g=>{const ti=titleImg(g),pics=(g.anhang||[]).filter(a=>a.typ==='bild'&&MEDIA.has(a.m));return`<article class="gs"><h3>${esc(g.titel)}</h3><p class="meta">${esc([TYP[g.typ]?TYP[g.typ][1]:'',g.jahr,g.erzaehlt&&'erzählt von '+g.erzaehlt,g.quelle&&'Quelle: '+g.quelle].filter(Boolean).join(', '))}</p>${ti?`<img class="ti ${ct(ti)}" src="${murl(ti)}" alt="">`:''}${md(g.text)}${pics.length?`<div class="pics">${pics.map(a=>`<img src="${murl(a.m)}" alt="">`).join('')}</div>`:''}</article>`}).join('')}</section>`}
 let pr=$('#print');if(!pr){pr=document.createElement('div');pr.id='print';document.body.appendChild(pr)}pr.innerHTML=h;
 let st=$('#pagesize');if(!st){st=document.createElement('style');st.id='pagesize';document.head.appendChild(st)}st.textContent=`@page{size:${o.fmt};margin:${o.fmt==='A5'?'12mm':'16mm'}}`;
 const th=document.documentElement.dataset.theme;document.documentElement.dataset.theme='light';document.body.classList.toggle('a5',o.fmt==='A5');
